  - id: azure-spot
    provider: azure
    region: eastus
    zone: '1'
    machine: Standard_F2s_v2
    image: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/runner-images/providers/Microsoft.Compute/images/ubuntu-2404-runner-amd64
    cpu: 2
    memoryMiB: 4096
    architecture: amd64
    capabilities:
    - docker
    spot: true
    priceMicros: 10000
    currency: USD
    observedAt: '2000-01-01T00:00:00Z'
  - id: azure-ondemand
    provider: azure
    region: eastus
    zone: '1'
    machine: Standard_F2s_v2
    image: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/runner-images/providers/Microsoft.Compute/images/ubuntu-2404-runner-amd64
    cpu: 2
    memoryMiB: 4096
    architecture: amd64
    capabilities:
    - docker
    spot: false
    priceMicros: 50000
    currency: USD
    observedAt: '2000-01-01T00:00:00Z'
  - id: gcp-spot
    provider: gcp
    region: us-central1
