# Illustrative, deliberately expired quotes. Replace with a real finite snapshot.
apiVersion: runnerscout.io/v1alpha1
kind: CapacityCatalog
metadata:
  name: multicloud
  namespace: runnerscout
spec:
  offerings:
  - id: aws-spot
    provider: aws
    region: us-east-1
    zone: us-east-1a
    machine: c7i.large
    image: ami-00000000000000000
    cpu: 2
    memoryMiB: 4096
    architecture: amd64
    capabilities:
    - docker
    spot: true
    priceMicros: 10000
    currency: USD
    observedAt: '2000-01-01T00:00:00Z'
  - id: aws-ondemand
    provider: aws
    region: us-east-1
    zone: us-east-1a
    machine: c7i.large
    image: ami-00000000000000000
    cpu: 2
    memoryMiB: 4096
    architecture: amd64
    capabilities:
    - docker
    spot: false
    priceMicros: 50000
    currency: USD
