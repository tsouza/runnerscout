\* This PR's fix: every one of the six call sites now has its own
\* externalCallBudget (or, for the two runLeader steps, githubStartupBudget)
\* context, independent of the bare cancel-only ctx above it.
\* Expect: clean - a stall at any site now recovers rather than sticking.
SPECIFICATION Spec
CONSTANTS
  BoundedCallSites = {"ScaleSetLookup", "SessionEstablish", "PruneDeregister",
                       "AWSPriceRefresh", "AzurePriceRefresh", "GCPPriceRefresh"}
INVARIANT TypeOK
INVARIANT NeverPermanentlyStuck
