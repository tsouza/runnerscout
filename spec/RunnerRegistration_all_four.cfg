\* Models PR #168's fix for #167: all four Deleted/TimedOut sites deregister.
\* No unknown leak, no reconciliation, no pruning gate -- isolates whether
\* patching exactly the four known sites is sufficient on its own.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  DeregOnPendingTimedOut = TRUE
  DeregOnCreatingDeleted = TRUE
  DeregOnRunningDeleted = TRUE
  DeregOnDeletingDeleted = TRUE
  EnableUnknownLeak = FALSE
  EnableReconciliation = FALSE
  PruneRequiresChecked = FALSE
INVARIANT TypeOK
INVARIANT NoOrphanedRegistration
INVARIANT NoIrrecoverableOrphan
