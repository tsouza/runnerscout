\* All four known sites patched (#168) PLUS a fifth, deliberately-unpatched
\* leak path PLUS age-only pruning (#161 exactly as it originally shipped,
\* PruneReVerifies=FALSE). Tests whether patching the four known sites,
\* without also changing how pruning itself works, is sufficient.
\* Expect: NoIrrecoverableOrphan is violated.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  DeregOnPendingTimedOut = TRUE
  DeregOnCreatingDeleted = TRUE
  DeregOnRunningDeleted = TRUE
  DeregOnDeletingDeleted = TRUE
  EnableUnknownLeak = TRUE
  PruneReVerifies = FALSE
INVARIANT TypeOK
INVARIANT NoIrrecoverableOrphan
