\* The real intermediate state that shipped between #178 and #182: JIT
\* failures preserve their cause, but WireGuard, cloud-create, observe, and
\* delete failures still do not. Historical - #182 already closed this gap
\* for the remaining four classes; see ExternalFailureVisibility_post_all_fixes.cfg
\* for what the code actually does today.
\* Expect: FailureCauseVisible violated.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  MaxAttempts = 2
  EnableTimeout = TRUE
  PreserveJITCause = TRUE
  PreserveWireGuardCause = FALSE
  PreserveCloudCreateCause = FALSE
  PreserveObserveCause = FALSE
  PreserveDeleteCause = FALSE
INVARIANT TypeOK
INVARIANT FailureCauseVisible
