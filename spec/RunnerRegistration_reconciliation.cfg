\* Same unpatched fifth leak path as unknown_leak.cfg, but now WITH a
\* periodic reconciliation action available AND pruning gated on a
\* confirmed check (not just age) -- the recommended fix for finding #3.
\* Expect: NoIrrecoverableOrphan holds (reconciliation existing at all is
\* enough to make GC safe even against an unpatched/unknown leak path).
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  DeregOnPendingTimedOut = TRUE
  DeregOnCreatingDeleted = TRUE
  DeregOnRunningDeleted = TRUE
  DeregOnDeletingDeleted = TRUE
  EnableUnknownLeak = TRUE
  EnableReconciliation = TRUE
  PruneRequiresChecked = TRUE
INVARIANT TypeOK
INVARIANT NoIrrecoverableOrphan
