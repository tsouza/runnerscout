\* The current code after #178: JIT failures preserve their cause, but
\* WireGuard, cloud-create, observe, and delete failures still do not.
\* Expect: FailureCauseVisible violated.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  MaxAttempts = 2
  EnableTimeout = TRUE
  PreserveJITCause = TRUE
  PreserveWireGuardCause = FALSE
  PreserveCloudCreateCause = FALSE
  PreserveObserveCause = FALSE
  PreserveDeleteCause = FALSE
INVARIANT TypeOK
INVARIANT FailureCauseVisible
