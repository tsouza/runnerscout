\* Models PR #163 exactly as it shipped: only Pending -> TimedOut deregisters
\* at transition time, and pruning is age-only (no re-verification - #161's
\* original design, before this branch's rework).
\* Expect: NoOrphanedRegistration violated - but read the counterexample
\* before assuming it goes through PendingTimedOut. After Claim/ToCreating's
\* guards were corrected to match Step's real causal order (Creating
\* persists first, registration can only follow - see RunnerRegistration.tla's
\* own header comment), a Pending-phase allocation can never actually be
\* Registered, so DeregOnPendingTimedOut = TRUE has no observable effect in
\* this config or any other: the violation TLC actually finds goes through
\* Claim -> ToCreating -> CreateConfirmedAbsent (the #167 Creating -> Deleted
\* gap), with DeregOnCreatingDeleted = FALSE doing the real work. This
\* config's name and DeregOnPendingTimedOut = TRUE still faithfully model
\* PR #163's own configuration (that PR only patched the one transition its
\* own name describes), but no longer describe which action the resulting
\* counterexample actually exercises - an earlier version of this comment
\* implied it did, which a later review caught (see README.background.md).
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  DeregOnPendingTimedOut = TRUE
  DeregOnCreatingDeleted = FALSE
  DeregOnRunningDeleted = FALSE
  DeregOnDeletingDeleted = FALSE
  EnableUnknownLeak = FALSE
  PruneReVerifies = FALSE
INVARIANT TypeOK
INVARIANT NoOrphanedRegistration
