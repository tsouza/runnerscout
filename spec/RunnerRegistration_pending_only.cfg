\* Models PR #163's fix for #162 exactly: only Pending -> TimedOut deregisters.
\* No unknown leak, no reconciliation, no pruning gate -- isolates the
\* original, single-transition gap.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  DeregOnPendingTimedOut = TRUE
  DeregOnCreatingDeleted = FALSE
  DeregOnRunningDeleted = FALSE
  DeregOnDeletingDeleted = FALSE
  EnableUnknownLeak = FALSE
  EnableReconciliation = FALSE
  PruneRequiresChecked = FALSE
INVARIANT TypeOK
INVARIANT NoOrphanedRegistration
