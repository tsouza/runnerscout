\* Reproduces issue #174 exactly as it shipped in v1.2.0: ReleaseSlot's own
\* guard only ever checked phase = Deleted, so a TimedOut allocation had no
\* path back to a usable slot at all, gated only on the separate zero-demand
\* Cohort reset this module does not model.
\* Expect: EveryTerminalIsReleasable violated - any reachable state with an
\* unreleased TimedOut allocation is a witness.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  MaxAdmitted = 2
  ReleasablePhases = {"Deleted"}
INVARIANT TypeOK
INVARIANT EveryTerminalIsReleasable
