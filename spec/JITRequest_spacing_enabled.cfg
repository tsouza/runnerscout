\* The #179 mitigation: a single token spaces JIT requests apart; a second
\* request must wait for JITAdvance.
\* Expect: clean.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  MaxAttempts = 2
  MaxClock = 2
  SpacingEnabled = TRUE
  EnableWaitCancellation = TRUE
INVARIANT TypeOK
INVARIANT NoJitBurst
