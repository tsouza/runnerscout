\* Every external failure class preserves its own observable cause. Not an
\* extrapolation - this matches the current shipped code exactly, as of
\* #182 (which closed the gap for WireGuard/cloud-create/observe/delete;
\* #178 already had JIT). See ExternalFailureVisibility_post178_pre182.cfg
\* for the real intermediate state that existed between those two.
\* Expect: clean.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  MaxAttempts = 2
  EnableTimeout = TRUE
  PreserveJITCause = TRUE
  PreserveWireGuardCause = TRUE
  PreserveCloudCreateCause = TRUE
  PreserveObserveCause = TRUE
  PreserveDeleteCause = TRUE
INVARIANT TypeOK
INVARIANT FailureCauseVisible
