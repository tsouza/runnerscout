\* Same unpatched fifth leak path as unknown_leak.cfg, but with the current
\* shipped design: Prune re-verifies/clears the registration as part of the
\* same action that deletes the record (PruneReVerifies=TRUE), rather than
\* trusting a flag set at transition time.
\* Expect: NoIrrecoverableOrphan holds - Prune's own re-verification covers
\* every leak cause, known or not, not just the four patched transitions.
SPECIFICATION Spec
CONSTANTS
  AllocIDs = {a1, a2}
  DeregOnPendingTimedOut = TRUE
  DeregOnCreatingDeleted = TRUE
  DeregOnRunningDeleted = TRUE
  DeregOnDeletingDeleted = TRUE
  EnableUnknownLeak = TRUE
  PruneReVerifies = TRUE
INVARIANT TypeOK
INVARIANT NoIrrecoverableOrphan
