\* Not hypothetical: this is the exact intermediate state this repository
\* was actually in between the first six call sites being bounded and the
\* seventh (AzureInterruptionPoll) being found and fixed - a real historical
\* state, not a constructed example. Demonstrates why "extrapolate past the
\* one incident-named pair" still was not enough the first time: even
\* fixing five more beyond the two the incident report actually named still
\* left the property broken, because it is a property of the whole set, not
\* of any fixed-in-advance subset of it.
\* Expect: NeverPermanentlyStuck violated via AzureInterruptionPoll.
SPECIFICATION Spec
