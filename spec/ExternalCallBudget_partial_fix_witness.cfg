\* Not hypothetical: this is the exact intermediate state this repository
\* was actually in between the first seven call sites being bounded and the
\* eighth/ninth (retry.go's AttemptJobs/RerunFailedJobs calls, on a GitHub
\* REST client with no fallback timeout of its own) being found by an
\* adversarial review of this same module's own completeness claim.
\* Demonstrates why "extrapolate past the one incident-named pair" was not
\* enough even after the first audit widened it to seven sites: even fixing
\* six more beyond the two the incident report actually named still left
\* the property broken, because it is a property of the whole set, not of
\* any fixed-in-advance subset of it - a lesson this same config already
\* demonstrated once for a six-site subset and now demonstrates again for
\* a seven-site one.
\* Expect: NeverPermanentlyStuck violated via RetryAttemptJobs.
SPECIFICATION Spec
CONSTANTS
  BoundedCallSites = {"ScaleSetLookup", "SessionEstablish", "PruneDeregister",
                       "AWSPriceRefresh", "AzurePriceRefresh", "GCPPriceRefresh",
                       "AzureInterruptionPoll"}
INVARIANT TypeOK
INVARIANT NeverPermanentlyStuck
