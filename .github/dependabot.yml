version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    groups:
      kubernetes-modules:
        patterns: ["k8s.io/api", "k8s.io/apimachinery", "k8s.io/client-go", "k8s.io/kube-openapi", "sigs.k8s.io/structured-merge-diff/*"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    groups:
      ci-actions:
        patterns: ["*"]
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
