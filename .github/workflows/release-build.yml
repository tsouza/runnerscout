# Three jobs, three very different trust levels.
#
# `build` packages release-candidate artifacts (multi-arch container image,
# Helm chart package, SBOM, checksums) for manual review. It never pushes an
# image to a registry and never signs anything. It runs on both trigger
# paths below.
#
# `publish` pushes the image built above to ghcr.io/tsouza/runnerscout and
# signs it keylessly with cosign (Sigstore Fulcio/Rekor - no stored private
# key). It runs ONLY when this workflow is invoked via workflow_call:
# `github.event_name` is set to the literal string "workflow_call" by
# GitHub itself whenever a workflow is invoked that way, and to
# "workflow_dispatch" for a direct manual run - this is not a value either
# trigger's `inputs:` can spoof. See
# https://docs.github.com/en/actions/learn-github-actions/contexts#github-context.
#
# `release` creates the GitHub Release object for the pushed tag and
# attaches the Helm chart, checksums and SBOM built above as release assets.
# It runs under the exact same `if: github.event_name == 'workflow_call'`
# condition as `publish`, for the exact same reason - see `publish`'s own
# comment below. It never creates the underlying git tag itself: that tag
# already exists by the time this job runs, because a real `git push` of a
# `v*.*.*` tag is what triggered release.yml in the first place. `release`
# only attaches a Release object to that pre-existing tag.
#
# Today the only caller that reaches workflow_call is release.yml's `build`
# job, itself gated on tools/release_preflight.py passing - so `publish` and
# `release` transitively only ever run after that gate.
#
# Two trigger paths, both intentional:
#   - workflow_dispatch: ad hoc manual runs against any commit. Builds
#     review artifacts only - `publish` and `release` cannot run from this
#     path.
#   - workflow_call: invoked by release.yml as a job, once its own
#     tools/release_preflight.py gate has passed, so the tag-triggered
#     pipeline and manual dispatch share this same build logic instead of
#     duplicating it. Only this path also publishes and releases.
# Never push/pull_request/tag directly, so this cannot fire automatically
# or accidentally outside those two explicit paths.
name: Release build
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA to build artifacts from
        required: true
        type: string
      release_tag:
        description: >-
          Unused for manual dispatch (the publish job never runs on this
          path); accepted only for input-shape parity with workflow_call.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      commit_sha:
        description: Exact commit SHA to build artifacts from
        required: true
        type: string
      release_tag:
        description: Release tag (vMAJOR.MINOR.PATCH) to push and sign the image as, alongside commit_sha
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-build-${{ inputs.commit_sha }}
  cancel-in-progress: false
jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Confirm checked-out commit matches the requested input
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "${{ inputs.commit_sha }}" ]; then
            echo "checked out $actual, expected ${{ inputs.commit_sha }}" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install pinned Helm
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/chart-venv/bin" >> "$GITHUB_PATH"
      - name: Make output directory
        run: mkdir -p release-artifacts
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Multi-arch image, saved locally as an OCI archive artifact. Never
      # pushed from this job: push is hardcoded false and no registry/tag is
      # configured. (The `publish` job below independently rebuilds and
      # pushes this same content - see its own comment for why.)
      - name: Build multi-arch runtime image (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: runnerscout:release-build
          cache-from: type=gha,scope=runnerscout-release-build
          cache-to: type=gha,scope=runnerscout-release-build,mode=max
          outputs: type=oci,dest=release-artifacts/runnerscout-image-multiarch.oci.tar

      # A single-arch (linux/amd64) copy loaded into the local Docker daemon
      # so an SBOM can be generated against a runnable image reference. It
      # reuses the layer cache from the multi-arch build above, so this is a
      # cache hit, not an independent rebuild. This image is never pushed.
      - name: Load linux/amd64 image for SBOM generation (not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: runnerscout:release-build-amd64
          cache-from: type=gha,scope=runnerscout-release-build

      - name: Generate SBOM for the built image (linux/amd64)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: runnerscout:release-build-amd64
          format: spdx-json
          output-file: release-artifacts/runnerscout-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      # Same packaging step ci.yml's chart job verifies (helm lint against
      # the same pinned Helm/kube-version), plus the actual `helm package`
      # that job stops short of. docs/releases.md lists a Helm package as a
      # required release artifact.
      - name: Lint Helm chart
        run: helm lint charts/runnerscout --strict --kube-version 1.37.0 -f charts/runnerscout/tests/values.json
      # `helm package --version`/`--app-version` override Chart.yaml's own
      # values for this package only - no file in the source tree is
      # mutated. Without this, every tagged release would ship the exact
      # same packaged chart version (Chart.yaml's static development
      # placeholder), regardless of which real release_tag it was built
      # for. Only overridden when release_tag is actually set (the
      # workflow_dispatch manual path leaves it empty and never runs
      # publish/release anyway, per this workflow's own input docs above).
      - name: Package Helm chart
        run: |
          version="${{ inputs.release_tag }}"
          version="${version#v}"
          if [ -n "$version" ]; then
            helm package charts/runnerscout --destination release-artifacts --version "$version" --app-version "$version"
          else
            helm package charts/runnerscout --destination release-artifacts
          fi

      - name: Generate SHA256 checksums for every artifact
        working-directory: release-artifacts
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ inputs.commit_sha }}-${{ github.run_id }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish
    needs: build
    # See this file's header: github.event_name is "workflow_call" only for
    # runs GitHub itself invoked via workflow_call (release.yml, after its
    # preflight gate) and is always "workflow_dispatch" for a direct manual
    # run, regardless of any input passed. This condition is what keeps
    # `publish` from ever firing on an ad hoc workflow_dispatch build.
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Confirm checked-out commit matches the requested input
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "${{ inputs.commit_sha }}" ]; then
            echo "checked out $actual, expected ${{ inputs.commit_sha }}" >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Rebuilds the exact same context/commit/Dockerfile as the `build`
      # job above, reading (not writing) that job's `runnerscout-release-build`
      # GHA cache scope. Because nothing about the inputs differs, this is a
      # full cache hit that repackages the layers `build` already produced
      # into a registry-push export, not an independent second build of
      # different content. A single build step producing both the local OCI
      # archive artifact and a registry push in one invocation was
      # considered (buildx supports multiple simultaneous --output
      # destinations) but rejected here: making that combination conditional
      # on the workflow_call/workflow_dispatch gate inside one step's inputs
      # is harder to verify by manual trace than gating a whole separate job,
      # and the cache-hit cost of a second export is negligible.
      - name: Build and push multi-arch runtime image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tsouza/runnerscout:${{ inputs.commit_sha }}
            ghcr.io/tsouza/runnerscout:${{ inputs.release_tag }}
          cache-from: type=gha,scope=runnerscout-release-build

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Keyless signing: no private key is stored anywhere. cosign uses this
      # job's own GitHub Actions OIDC identity token (granted by the
      # id-token: write permission above) to obtain a short-lived signing
      # certificate from Sigstore's public Fulcio CA, then publishes the
      # signature and that certificate to Sigstore's public Rekor
      # transparency log. Signs the resolved digest, not the mutable tags
      # above, so the signature is bound to the exact content just pushed.
      # See https://docs.sigstore.dev/quickstart/quickstart-ci/.
      - name: Sign the image keylessly
        run: cosign sign --yes "ghcr.io/tsouza/runnerscout@${{ steps.push.outputs.digest }}"

      - name: Download the SBOM produced by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ inputs.commit_sha }}-${{ github.run_id }}
          path: release-artifacts

      # cosign attest (not cosign sign) is the correct primitive for an
      # SBOM: it wraps the SPDX document in a signed in-toto attestation
      # (predicate type "spdxjson") bound to the image digest, rather than
      # treating the SBOM as a bare signature payload the way an image
      # signature works.
      - name: Attest the SBOM keylessly
        run: |
          cosign attest --yes \
            --predicate release-artifacts/runnerscout-sbom.spdx.json \
            --type spdxjson \
            "ghcr.io/tsouza/runnerscout@${{ steps.push.outputs.digest }}"

  release:
    name: release
    needs: publish
    # Identical condition to `publish` above, checked the same way: this
    # value comes from GitHub itself ("workflow_call" only for a run GitHub
    # invoked via workflow_call, "workflow_dispatch" for a direct manual
    # run regardless of any input), so no input can spoof it. `needs:
    # publish` additionally means this job cannot even start unless publish
    # already ran (and this `if` re-check is not redundant with that: a
    # skipped `publish` still satisfies `needs`, so the `if` is what
    # actually keeps `release` off the workflow_dispatch path).
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only scope this job needs beyond the workflow's default
      # contents:read: creating a GitHub Release (and attaching assets to
      # it) requires contents:write. Granted only here, not at this
      # workflow's top-level `permissions:` or at `build`/`publish`, per the
      # same "narrowest possible job" discipline release.yml's call site
      # already uses for packages:write/id-token:write. release.yml's
      # `build` job call site grants contents:write as this reusable
      # workflow's ceiling for that same reason - see its own comment.
      contents: write
    steps:
      - name: Download build artifacts (Helm chart, checksums, SBOM)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ inputs.commit_sha }}-${{ github.run_id }}
          path: release-artifacts

      # Pre-1.0 APIs remain experimental (docs/releases.md). A v0.x.y tag is
      # marked as a GitHub prerelease so consumers can tell it apart from a
      # v1.0.0+ tag at a glance; only the major component decides this, per
      # the vMAJOR.MINOR.PATCH convention documented there.
      - name: Determine prerelease status from tag major version
        id: version
        run: |
          tag="${{ inputs.release_tag }}"
          if [[ "$tag" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            major="${BASH_REMATCH[1]}"
          else
            echo "release_tag '$tag' does not match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [ "$major" = "0" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # No checkout: the tag itself already exists (a real `git push` of it
      # is what triggered release.yml), so `gh release create` only needs
      # to know which repo and which pre-existing tag/commit to attach a
      # Release object and assets to - both given explicitly below, not
      # inferred from a local working tree. Release notes are
      # auto-generated from merged PRs since the previous release
      # (`--generate-notes`); this repo has no CHANGELOG or release-notes
      # template of its own (checked: none exists), so auto-generation is
      # used as a reasonable default rather than a bespoke convention.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(
            "${{ inputs.release_tag }}"
            --target "${{ inputs.commit_sha }}"
            --title "${{ inputs.release_tag }}"
            --generate-notes
            release-artifacts/*.tgz
            release-artifacts/checksums.txt
            release-artifacts/runnerscout-sbom.spdx.json
          )
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
