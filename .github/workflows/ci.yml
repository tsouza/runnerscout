name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  # pull_request: github.ref is unique per PR (refs/pull/<n>/merge), so
  # cancelling an in-progress run when new commits supersede it is safe -
  # only that PR's own stale run is ever cancelled.
  # push: github.ref is always refs/heads/main, identical across every
  # merge. The five heavy jobs gated in this workflow are the ONLY
  # validation main gets post-merge (see docs/qualification.md) - if two
  # merges land close together, a shared ref-only group would let the
  # second push's run cancel the first's before it finishes, silently
  # leaving that earlier commit's tree never actually validated by the
  # suite this whole split exists to run. This is not hypothetical: it
  # happened during this session's own ordinary merge cadence (runtime-image
  # on a push run cancelled ~4 minutes in by the next merge, four minutes
  # later, per an adversarial review that caught it against real run
  # history). Including github.sha only for push events gives every push
  # its own group, so pushes never cancel each other, while pull_request's
  # per-PR cancellation behavior is completely unchanged.
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A change is "docs-only" (code: false) only when every changed
          # file matches **/*.md - this is a deny-list of exactly one
          # pattern, never an allow-list of "safe" paths, so anything this
          # filter has not seen before (a renamed file, a new file type, a
          # workflow edit, a chart/Dockerfile change) defaults to code:
          # true and the full post-merge suite still runs. This only
          # affects the push-to-main run below (see each gated job's own
          # `if:`), not merge eligibility - see docs/qualification.md's
          # Evaluator authority section for what is and isn't a PR merge
          # gate now.
          filters: |
            code:
              - '!**/*.md'
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
          save: 'true'
      - run: make verify-generated
      - run: make verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  vulnerability:
    name: vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  kubernetes-integration:
    name: kubernetes-integration
    needs: changes
    # This job is no longer a required merge gate (see the Ruleset and
    # docs/qualification.md): it runs only on push to main, immediately
    # after a merge, never blocking a PR's own merge. github.event_name ==
    # 'push' is checked first specifically so a pull_request run never
    # reaches needs.changes.outputs.code at all. needs.changes.result !=
    # 'success' still defaults to running this job whenever the changes job
    # itself did not cleanly resolve (failed, cancelled) on a push run - a
    # custom `if:` replaces the default success() gate, so without this a
    # failed changes job would leave outputs.code unset and silently skip
    # this check instead of safely running it.
    if: github.event_name == 'push' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Create isolated Kubernetes
        run: go run sigs.k8s.io/kind@v0.33.0 create cluster --name runnerscout-ci --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 120s
      - name: Verify persistence, CAS and CRDs
        run: RUNNERSCOUT_TEST_KUBECONFIG="$RUNNER_TEMP/kubeconfig" make integration
      - name: Delete isolated cluster
        if: always()
        run: go run sigs.k8s.io/kind@v0.33.0 delete cluster --name runnerscout-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kubernetes-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/integration-*/
          if-no-files-found: error
          retention-days: 14

  cloud-emulators:
    name: cloud-emulators
    needs: changes
    # This job is no longer a required merge gate (see the Ruleset and
    # docs/qualification.md): it runs only on push to main, immediately
    # after a merge, never blocking a PR's own merge. github.event_name ==
    # 'push' is checked first specifically so a pull_request run never
    # reaches needs.changes.outputs.code at all. needs.changes.result !=
    # 'success' still defaults to running this job whenever the changes job
    # itself did not cleanly resolve (failed, cancelled) on a push run - a
    # custom `if:` replaces the default success() gate, so without this a
    # failed changes job would leave outputs.code unset and silently skip
    # this check instead of safely running it.
    if: github.event_name == 'push' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - run: make emulators
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-emulators-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  chart:
    name: chart
    needs: changes
    # This job is no longer a required merge gate (see the Ruleset and
    # docs/qualification.md): it runs only on push to main, immediately
    # after a merge, never blocking a PR's own merge. github.event_name ==
    # 'push' is checked first specifically so a pull_request run never
    # reaches needs.changes.outputs.code at all. needs.changes.result !=
    # 'success' still defaults to running this job whenever the changes job
    # itself did not cleanly resolve (failed, cancelled) on a push run - a
    # custom `if:` replaces the default success() gate, so without this a
    # failed changes job would leave outputs.code unset and silently skip
    # this check instead of safely running it.
    if: github.event_name == 'push' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Install pinned chart tools
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/chart-venv/bin" >> "$GITHUB_PATH"
      - run: make chart

  runtime-image:
    name: runtime-image
    needs: changes
    # This job is no longer a required merge gate (see the Ruleset and
    # docs/qualification.md): it runs only on push to main, immediately
    # after a merge, never blocking a PR's own merge. github.event_name ==
    # 'push' is checked first specifically so a pull_request run never
    # reaches needs.changes.outputs.code at all. needs.changes.result !=
    # 'success' still defaults to running this job whenever the changes job
    # itself did not cleanly resolve (failed, cancelled) on a push run - a
    # custom `if:` replaces the default success() gate, so without this a
    # failed changes job would leave outputs.code unset and silently skip
    # this check instead of safely running it.
    if: github.event_name == 'push' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Install pinned Helm and kubectl
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/linux-amd64/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256 --output "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/linux-amd64/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/linux-amd64/kubectl"
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/chart-venv/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          install-only: true
      # The Dockerfile only COPYs a prebuilt binary now (see its own
      # comment and .goreleaser.yml's builds: section) - this runner is
      # always linux/amd64, matching docker/build-push-action's own
      # default single-platform build below with no platforms: override.
      - name: Build the runtime binary
        run: goreleaser build --single-target --snapshot --clean --skip=before -o linux/amd64/runnerscout
      - name: Build runtime with persistent layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: runnerscout:development
          cache-from: type=gha,scope=runnerscout-runtime-amd64
          cache-to: type=gha,scope=runnerscout-runtime-amd64,mode=max
      - run: make image-test
      - run: make helm-integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  report-post-merge-failure:
    name: report-post-merge-failure
    needs: [kubernetes-integration, cloud-emulators, chart, runtime-image]
    # This job is the forcing function that makes a post-merge failure
    # visible somewhere a human will actually see it (see docs/qualification.md's
    # Evaluator authority section) - the four heavy jobs above are the only
    # validation main gets, and without this a failed or cancelled run was
    # previously just a red/grey mark on the Actions tab. `if: always()` is
    # required here (not the default implicit success()-only gate a job
    # gets from listing `needs:`) because without it this job would itself
    # be skipped precisely when a dependency failed or was cancelled - the
    # one case it exists to handle. `always()` makes it run unconditionally
    # so its steps below can inspect each needs.<job>.result individually;
    # a job-level `if: failure()` would not help, since that only reflects
    # this job's own steps, not its dependencies'. github.event_name ==
    # 'push' keeps this from ever evaluating on a pull_request run, where
    # these four jobs are always skipped by design and skipped is not a
    # failure.
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify failed or cancelled heavy jobs
        id: failures
        env:
          # A job's own `if: failure()` cannot see which of several sibling
          # dependencies specifically failed - each needs.<job>.result is
          # read individually here to build an exact report. `cancelled` is
          # reported alongside `failure`: the concurrency fix in #60 stops
          # one push from cancelling another push's run of these jobs, but a
          # cancellation can still happen for reasons that fix does not
          # touch (a manual cancellation, a runner outage, an org-level
          # concurrency limit) - however it happens, a cancelled run means
          # this commit's tree was not actually validated by this suite,
          # which is exactly the condition this job exists to surface.
          # `skipped` (the docs-only fast path from the `changes` job) is
          # deliberately not reported: that is an intended outcome, not a
          # failure.
          KUBERNETES_INTEGRATION_RESULT: ${{ needs.kubernetes-integration.result }}
          CLOUD_EMULATORS_RESULT: ${{ needs.cloud-emulators.result }}
          CHART_RESULT: ${{ needs.chart.result }}
          RUNTIME_IMAGE_RESULT: ${{ needs.runtime-image.result }}
        run: |
          declare -A results=(
            [kubernetes-integration]="$KUBERNETES_INTEGRATION_RESULT"
            [cloud-emulators]="$CLOUD_EMULATORS_RESULT"
            [chart]="$CHART_RESULT"
            [runtime-image]="$RUNTIME_IMAGE_RESULT"
          )
          failed=()
          for job in kubernetes-integration cloud-emulators chart runtime-image; do
            case "${results[$job]}" in
              failure|cancelled)
                failed+=("$job (${results[$job]})")
                ;;
            esac
          done
          {
            echo "failed-jobs<<FAILEDJOBSEOF"
            printf '%s\n' "${failed[@]}"
            echo "FAILEDJOBSEOF"
          } >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/report-post-merge-failure
        with:
          failed-jobs: ${{ steps.failures.outputs.failed-jobs }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          github-token: ${{ github.token }}
