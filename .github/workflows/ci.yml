name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # A change is "docs-only" (code: false) only when every changed
          # file matches **/*.md - this is a deny-list of exactly one
          # pattern, never an allow-list of "safe" paths, so anything this
          # filter has not seen before (a renamed file, a new file type, a
          # workflow edit, a chart/Dockerfile change) defaults to code:
          # true and the full required-check suite still runs. A required
          # GitHub Actions check that is skipped (rather than run and
          # green) still satisfies a Ruleset's required-status-check rule,
          # so this filter being wrong in the unsafe direction would
          # silently weaken this repo's evaluator authority
          # (docs/qualification.md) - it must only ever skip when the diff
          # provably cannot contain anything the skipped jobs check.
          filters: |
            code:
              - '!**/*.md'
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
          save: 'true'
      - run: make verify-generated
      - run: make verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  vulnerability:
    name: vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  kubernetes-integration:
    name: kubernetes-integration
    needs: changes
    # needs.changes.result != 'success' defaults to running this job
    # whenever the changes job itself did not cleanly resolve (failed,
    # cancelled) - a custom `if:` replaces the default success() gate, so
    # without this, a failed changes job would leave outputs.code unset
    # and silently skip this required check instead of safely running it.
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Create isolated Kubernetes
        run: go run sigs.k8s.io/kind@v0.33.0 create cluster --name runnerscout-ci --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/kubeconfig" --wait 120s
      - name: Verify persistence, CAS and CRDs
        run: RUNNERSCOUT_TEST_KUBECONFIG="$RUNNER_TEMP/kubeconfig" make integration
      - name: Delete isolated cluster
        if: always()
        run: go run sigs.k8s.io/kind@v0.33.0 delete cluster --name runnerscout-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kubernetes-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/integration-*/
          if-no-files-found: error
          retention-days: 14

  cloud-emulators:
    name: cloud-emulators
    needs: changes
    # needs.changes.result != 'success' defaults to running this job
    # whenever the changes job itself did not cleanly resolve (failed,
    # cancelled) - a custom `if:` replaces the default success() gate, so
    # without this, a failed changes job would leave outputs.code unset
    # and silently skip this required check instead of safely running it.
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - run: make emulators
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cloud-emulators-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  chart:
    name: chart
    needs: changes
    # needs.changes.result != 'success' defaults to running this job
    # whenever the changes job itself did not cleanly resolve (failed,
    # cancelled) - a custom `if:` replaces the default success() gate, so
    # without this, a failed changes job would leave outputs.code unset
    # and silently skip this required check instead of safely running it.
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Install pinned chart tools
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/chart-venv/bin" >> "$GITHUB_PATH"
      - run: make chart

  runtime-image:
    name: runtime-image
    needs: changes
    # needs.changes.result != 'success' defaults to running this job
    # whenever the changes job itself did not cleanly resolve (failed,
    # cancelled) - a custom `if:` replaces the default success() gate, so
    # without this, a failed changes job would leave outputs.code unset
    # and silently skip this required check instead of safely running it.
    if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Install pinned Helm and kubectl
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/linux-amd64/kubectl"
          curl --fail --silent --show-error --location https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256 --output "$RUNNER_TEMP/kubectl.sha256"
          echo "$(cat "$RUNNER_TEMP/kubectl.sha256")  $RUNNER_TEMP/linux-amd64/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/linux-amd64/kubectl"
          python3 -m venv "$RUNNER_TEMP/chart-venv"
          "$RUNNER_TEMP/chart-venv/bin/pip" install PyYAML==6.0.3
          echo "$RUNNER_TEMP/chart-venv/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build runtime with persistent layer cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: runnerscout:development
          cache-from: type=gha,scope=runnerscout-runtime-amd64
          cache-to: type=gha,scope=runnerscout-runtime-amd64,mode=max
      - run: make image-test
      - run: make helm-integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runtime-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
