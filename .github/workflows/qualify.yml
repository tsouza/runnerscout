# Real-cloud provider qualification (issue #3's "Final real-cloud
# qualification" scope). This is the single, matrixed successor to what were
# previously three separate workflows - qualify-aws.yml, qualify-azure.yml
# and qualify-gcp.yml - consolidated into one file per-provider fan-out via
# a job matrix, with a `provider` input to run all three or just one. The
# safety philosophy, the per-provider validation/credential/cleanup logic,
# and every literal check below are carried over unchanged from those three
# workflows; only the mechanism for selecting which provider(s) run changed.
# See docs/qualification-real-cloud.md for the current procedural
# description and docs/qualification-real-cloud.background.md for why each
# provider's checks look the way they do (still accurate: only the file
# layout changed, not the reasoning).
#
# This workflow provisions ONE real, billed compute instance per selected
# provider through the production internal/provider adapter for that cloud
# (never modified by this workflow or its accompanying *_realcloud_test.go
# files) and independently verifies it is fully torn down afterward. It is
# the only automation in this repository that spends real money when it
# runs, so every design choice is biased toward "impossible to trigger by
# accident" over convenience:
#
#   - workflow_dispatch is the ONLY trigger. No schedule, no push, no
#     pull_request. A human must explicitly run this, every time.
#   - A required `confirm_real_spend` input must match an exact literal
#     phrase, checked before anything else runs for a given provider
#     (including before that provider's credentials are ever configured) -
#     a second, deliberate speed bump beyond workflow_dispatch's own
#     "someone had to click Run workflow" protection, so a scripted
#     `gh workflow run` with stale/default arguments cannot silently
#     provision real resources either.
#   - `max_runtime_minutes` is a required, explicit numeric VM-time bound -
#     issue #3's own "numeric spend/VM-time allocation" wording - validated
#     against a hard-coded workflow ceiling
#     (RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES below) that no input
#     value can exceed, shared across all three providers. The job's own
#     `timeout-minutes:` is a second, independent, non-input-derived
#     ceiling on the whole job.
#   - Every network identifier and pinned image (per provider - see each
#     input's own description below) is a required-for-that-provider
#     operator-supplied input - this workflow never discovers or selects
#     any of them dynamically. Because a single workflow_dispatch form
#     cannot make an input conditionally required on another input's value,
#     every per-provider input is declared `required: false` at the trigger
#     level and instead validated as required by that provider's own
#     "Validate pinned identifier shapes" step below - the same
#     fail-cleanly-with-zero-cloud-interaction property the original three
#     workflows had, just enforced one step later. A pre-flight step per
#     provider independently cross-checks that its network identifiers
#     actually belong together before any create call, catching a
#     pasted-wrong-ID mistake with zero cost (all read-only calls).
#   - Teardown/independent-verification runs via `if: always()` (the final
#     step of each provider's steps), exactly like this repo's other CI
#     jobs already do for evidence upload - a failed or killed run must
#     never leave a running, billable VM behind. This is the authoritative
#     backstop: it survives even a job-level timeout or cancellation that
#     would kill the Go test process (and therefore skip its own in-process
#     t.Cleanup) before it could finish tearing down.
#   - `provider: all` (the default) fans out to all three providers as
#     independent matrix jobs (fail-fast: false, so one provider's failure
#     never cancels another's in-flight teardown); `provider: aws` (etc.)
#     runs only that one. Each provider keeps its own concurrency group
#     (qualify-aws/qualify-azure/qualify-gcp), unchanged from the original
#     three workflows, so a second dispatch against the same provider still
#     queues behind an in-flight one instead of racing it for the same
#     pinned network resources - but the three providers themselves remain
#     independent and can run concurrently within a single `provider: all`
#     dispatch, exactly as they could as separate workflows before.
#
# Credentials, per provider (unchanged from the original three workflows):
#   - AWS: OIDC role assumption (aws-actions/configure-aws-credentials with
#     role-to-assume) is preferred; a static-key fallback
#     (AWS_QUALIFICATION_ACCESS_KEY_ID/AWS_QUALIFICATION_SECRET_ACCESS_KEY
#     secrets) is also supported. See docs/qualification-real-cloud.background.md's
#     "Why OIDC and the static-key fallback were both built, not deferred".
#   - Azure: Workload Identity Federation (OIDC) is the ONLY supported path
#     - no client-secret fallback. AZURE_QUALIFICATION_CLIENT_ID/
#     AZURE_QUALIFICATION_TENANT_ID/AZURE_QUALIFICATION_SUBSCRIPTION_ID are
#     repository VARIABLES, not secrets (see docs/qualification-real-cloud.background.md's
#     Azure section for why).
#   - GCP: Workload Identity Federation only
#     (google-github-actions/auth with workload_identity_provider +
#     service_account) - deliberately no service account key JSON fallback
#     (see docs/qualification-real-cloud.background.md's GCP section).
name: Qualify (real cloud)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Which provider(s) to qualify. "all" fans out to AWS, Azure and GCP as independent matrix jobs.
        required: true
        type: choice
        default: all
        options:
          - all
          - aws
          - azure
          - gcp
      confirm_real_spend:
        description: >-
          Must be exactly: I-UNDERSTAND-THIS-COSTS-REAL-MONEY - this run
          provisions one real, billed compute instance per selected
          provider.
        required: true
        type: string
      max_runtime_minutes:
        description: Hard VM-time bound for the create/observe/price phase, as a plain integer, shared across every selected provider. Must be between 1 and 20 (workflow-enforced ceiling) - see this workflow's own header comment.
        required: true
        type: string
      aws_region:
        description: "[AWS] Pinned AWS region to qualify against (e.g. us-east-1). Required only when provider is aws or all."
        required: false
        type: string
      aws_vpc_id:
        description: "[AWS] Pinned, pre-provisioned isolated VPC id (vpc-...) that aws_subnet_id and aws_security_group_id must both belong to."
        required: false
        type: string
      aws_subnet_id:
        description: "[AWS] Pinned, pre-provisioned subnet id (subnet-...) to launch into."
        required: false
        type: string
      aws_security_group_id:
        description: "[AWS] Pinned, pre-provisioned security group id (sg-...) to attach."
        required: false
        type: string
      aws_ami_id:
        description: "[AWS] Pinned AMI id (ami-...) to launch. Must be available, EBS-backed, and match aws_architecture."
        required: false
        type: string
      aws_instance_type:
        description: "[AWS] EC2 instance type (e.g. t3.micro / t4g.micro). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes."
        required: false
        type: string
      aws_architecture:
        description: "[AWS] Must match aws_ami_id's real architecture."
        required: false
        type: choice
        default: unset
        options:
          - unset
          - amd64
          - arm64
      azure_region:
        description: "[Azure] Pinned Azure region to qualify against (e.g. eastus). Required only when provider is azure or all."
        required: false
        type: string
      azure_subscription_id:
        description: "[Azure] Pinned Azure subscription GUID to qualify against."
        required: false
        type: string
      azure_resource_group:
        description: "[Azure] Pinned, pre-provisioned, dedicated qualification resource group name (never a production resource group)."
        required: false
        type: string
      azure_subnet_id:
        description: >-
          [Azure] Pinned, pre-provisioned subnet resource ID (a full ARM ID
          ending in /subnets/<name>). Its own /subnets/ prefix IS the VNet
          resource ID - no separate VNet input is needed since one is always
          fully reconstructible from the other.
        required: false
        type: string
      azure_nsg_id:
        description: "[Azure] Pinned, pre-provisioned network security group resource ID to attach."
        required: false
        type: string
      azure_image_id:
        description: "[Azure] Pinned managed-image resource ID (Microsoft.Compute/images/...). Must be an available, generalized Linux image with only an OS disk."
        required: false
        type: string
      azure_vm_size:
        description: "[Azure] Azure VM size (e.g. Standard_D2s_v3). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes."
        required: false
        type: string
      azure_availability_zone:
        description: "[Azure] Pinned Azure Availability Zone for the VM. Must be supported by both azure_region and azure_vm_size."
        required: false
        type: choice
        default: unset
        options:
          - unset
          - "1"
          - "2"
          - "3"
      gcp_project:
        description: "[GCP] Pinned GCP project id to qualify against. Must equal the vars.GCP_QUALIFICATION_PROJECT_ID this identity is provisioned for. Required only when provider is gcp or all."
        required: false
        type: string
      gcp_region:
        description: "[GCP] Pinned GCP region to qualify against (e.g. us-central1)."
        required: false
        type: string
      gcp_zone:
        description: "[GCP] Pinned GCP zone (e.g. us-central1-a). Must belong to gcp_region."
        required: false
        type: string
      gcp_network:
        description: "[GCP] Pinned, pre-provisioned isolated VPC network name that gcp_subnetwork must belong to."
        required: false
        type: string
      gcp_subnetwork:
        description: "[GCP] Pinned, pre-provisioned subnetwork name (in gcp_region) to launch into."
        required: false
        type: string
      gcp_image:
        description: >-
          [GCP] Pinned boot image, as an exact image self-link (e.g.
          projects/debian-cloud/global/images/debian-12-bookworm-v20250910 -
          look up the current name with `gcloud compute images list
          --project debian-cloud --filter="family=debian-12"`). NEVER a
          rolling family reference (.../images/family/debian-12).
        required: false
        type: string
      gcp_machine_type:
        description: "[GCP] GCE machine type (e.g. e2-micro). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes."
        required: false
        type: string
permissions:
  contents: read
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      - id: plan
        run: |
          set -euo pipefail
          case "${{ inputs.provider }}" in
            all) echo 'providers=["aws","azure","gcp"]' >> "$GITHUB_OUTPUT" ;;
            aws|azure|gcp) echo "providers=[\"${{ inputs.provider }}\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::provider must be one of: all, aws, azure, gcp - got '${{ inputs.provider }}'"; exit 1 ;;
          esac

  qualify:
    name: qualify (${{ matrix.provider }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    concurrency:
      # Unchanged per-provider serialization from the original three
      # workflows: a second dispatch against the same provider queues
      # behind an in-flight one rather than racing it for the same pinned
      # network resources. cancel-in-progress is deliberately false -
      # cancelling a run that is mid-teardown of a real billed instance is
      # strictly worse than making the next run wait. Providers remain
      # independent of each other.
      group: qualify-${{ matrix.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Hard-coded, independent of max_runtime_minutes: setup/build (~5m) +
    # the go test step's own worst-case -timeout below (max_runtime_minutes's
    # 20m ceiling + 10m, i.e. 30m, which already includes the test's own
    # fixed 5m teardown budget) + margin for the remaining steps. No input
    # can raise this. Unchanged from all three original workflows.
    timeout-minutes: 40
    permissions:
      contents: read
      # Consumed by whichever provider's credential step actually runs for
      # this matrix job: AWS's OIDC path (when AWS_QUALIFICATION_ROLE_ARN is
      # set), Azure's azure/login + separately-fetched OIDC token, and GCP's
      # google-github-actions/auth all need this. Granting it once here
      # covers all three; each provider's steps only ever consume it when
      # matrix.provider selects that provider.
      id-token: write
    env:
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES: "20"
      RUNNERSCOUT_QUALIFY_CONFIRM: ${{ inputs.confirm_real_spend }}
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
      RUNNERSCOUT_QUALIFY_ALLOCATION_ID: qualify-${{ matrix.provider }}-${{ github.run_id }}
      RUNNERSCOUT_QUALIFY_EVIDENCE_DIR: evidence/qualify-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
      # AWS
      RUNNERSCOUT_QUALIFY_AWS_REGION: ${{ inputs.aws_region }}
      RUNNERSCOUT_QUALIFY_AWS_VPC: ${{ inputs.aws_vpc_id }}
      RUNNERSCOUT_QUALIFY_AWS_SUBNET: ${{ inputs.aws_subnet_id }}
      RUNNERSCOUT_QUALIFY_AWS_SECURITY_GROUP: ${{ inputs.aws_security_group_id }}
      RUNNERSCOUT_QUALIFY_AWS_AMI: ${{ inputs.aws_ami_id }}
      RUNNERSCOUT_QUALIFY_AWS_INSTANCE_TYPE: ${{ inputs.aws_instance_type }}
      RUNNERSCOUT_QUALIFY_AWS_ARCHITECTURE: ${{ inputs.aws_architecture }}
      # Azure
      RUNNERSCOUT_QUALIFY_AZURE_REGION: ${{ inputs.azure_region }}
      RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP: ${{ inputs.azure_resource_group }}
      # RUNNERSCOUT_QUALIFY_AZURE_VNET_ID is not a workflow_dispatch input
      # (workflow_dispatch has a hard 25-input cap, already reached without
      # it) - it is derived from azure_subnet_id's own /subnets/ prefix by
      # the "[Azure] Validate pinned identifier shapes" step below and
      # exported via GITHUB_ENV, since one is always fully reconstructible
      # from the other.
      RUNNERSCOUT_QUALIFY_AZURE_SUBNET_ID: ${{ inputs.azure_subnet_id }}
      RUNNERSCOUT_QUALIFY_AZURE_NSG_ID: ${{ inputs.azure_nsg_id }}
      RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID: ${{ inputs.azure_image_id }}
      RUNNERSCOUT_QUALIFY_AZURE_VM_SIZE: ${{ inputs.azure_vm_size }}
      RUNNERSCOUT_QUALIFY_AZURE_ZONE: ${{ inputs.azure_availability_zone }}
      # GCP
      RUNNERSCOUT_QUALIFY_GCP_PROJECT: ${{ inputs.gcp_project }}
      RUNNERSCOUT_QUALIFY_GCP_REGION: ${{ inputs.gcp_region }}
      RUNNERSCOUT_QUALIFY_GCP_ZONE: ${{ inputs.gcp_zone }}
      RUNNERSCOUT_QUALIFY_GCP_NETWORK: ${{ inputs.gcp_network }}
      RUNNERSCOUT_QUALIFY_GCP_SUBNETWORK: ${{ inputs.gcp_subnetwork }}
      RUNNERSCOUT_QUALIFY_GCP_IMAGE: ${{ inputs.gcp_image }}
      RUNNERSCOUT_QUALIFY_GCP_MACHINE_TYPE: ${{ inputs.gcp_machine_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate explicit confirmation and numeric runtime ceiling
        # Deliberately the very first step, before Go setup and before any
        # cloud credential is configured: an invalid confirmation phrase or
        # an out-of-bound runtime request must fail with zero cloud
        # interaction of any kind, not even a read-only one. Shared across
        # all three providers - unchanged literal check from the original
        # three workflows.
        run: |
          set -euo pipefail
          expected='I-UNDERSTAND-THIS-COSTS-REAL-MONEY'
          if [ "$RUNNERSCOUT_QUALIFY_CONFIRM" != "$expected" ]; then
            echo "::error::confirm_real_spend must be exactly '$expected' - refusing to provision real, billed ${{ matrix.provider }} resources without this exact literal confirmation"
            exit 1
          fi
          max="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES"
          ceiling="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES"
          if ! [[ "$max" =~ ^[0-9]+$ ]] || [ "$max" -lt 1 ] || [ "$max" -gt "$ceiling" ]; then
            echo "::error::max_runtime_minutes must be a plain integer between 1 and $ceiling (hard-coded workflow ceiling); got '$max'"
            exit 1
          fi

      - name: "[AWS] Validate pinned identifier shapes"
        if: matrix.provider == 'aws'
        # Cheap, local, no AWS call: catches an obviously-wrong paste (e.g. a
        # subnet id in the aws_vpc_id field), and enforces that every
        # AWS-specific input is actually present - workflow_dispatch cannot
        # make an input conditionally required on provider's value, so this
        # step is where "required for AWS" is actually enforced.
        run: |
          set -euo pipefail
          # "unset" is aws_architecture's own sentinel default (choice
          # inputs cannot have an empty-string option) - treated the same
          # as genuinely empty.
          require() { [ -n "$2" ] && [ "$2" != "unset" ] || { echo "::error::$1 is required when provider is aws or all"; exit 1; }; }
          require aws_region "$RUNNERSCOUT_QUALIFY_AWS_REGION"
          require aws_vpc_id "$RUNNERSCOUT_QUALIFY_AWS_VPC"
          require aws_subnet_id "$RUNNERSCOUT_QUALIFY_AWS_SUBNET"
          require aws_security_group_id "$RUNNERSCOUT_QUALIFY_AWS_SECURITY_GROUP"
          require aws_ami_id "$RUNNERSCOUT_QUALIFY_AWS_AMI"
          require aws_instance_type "$RUNNERSCOUT_QUALIFY_AWS_INSTANCE_TYPE"
          require aws_architecture "$RUNNERSCOUT_QUALIFY_AWS_ARCHITECTURE"
          check() {
            case "$2" in
              "$3"*) ;;
              *) echo "::error::$1 ('$2') does not look like a $3* id"; exit 1 ;;
            esac
          }
          check aws_vpc_id "$RUNNERSCOUT_QUALIFY_AWS_VPC" vpc-
          check aws_subnet_id "$RUNNERSCOUT_QUALIFY_AWS_SUBNET" subnet-
          check aws_security_group_id "$RUNNERSCOUT_QUALIFY_AWS_SECURITY_GROUP" sg-
          check aws_ami_id "$RUNNERSCOUT_QUALIFY_AWS_AMI" ami-

      - name: "[Azure] Validate pinned identifier shapes"
        if: matrix.provider == 'azure'
        # Cheap, local, no Azure call: catches an obviously-wrong paste
        # before even resolving credentials, and enforces that every
        # Azure-specific input is actually present (see the AWS step's own
        # comment on why this is where "required for Azure" is enforced).
        # Azure ARM resource IDs self-describe their own
        # subscription/resource group/provider/type in their path.
        env:
          RUNNERSCOUT_QUALIFY_EXPECTED_SUBSCRIPTION_ID: ${{ vars.AZURE_QUALIFICATION_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          # "unset" is azure_availability_zone's own sentinel default
          # (choice inputs cannot have an empty-string option) - treated the
          # same as genuinely empty.
          require() { [ -n "$2" ] && [ "$2" != "unset" ] || { echo "::error::$1 is required when provider is azure or all"; exit 1; }; }
          require azure_region "$RUNNERSCOUT_QUALIFY_AZURE_REGION"
          require azure_subscription_id "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID"
          require azure_resource_group "$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP"
          require azure_subnet_id "$RUNNERSCOUT_QUALIFY_AZURE_SUBNET_ID"
          require azure_nsg_id "$RUNNERSCOUT_QUALIFY_AZURE_NSG_ID"
          require azure_image_id "$RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID"
          require azure_vm_size "$RUNNERSCOUT_QUALIFY_AZURE_VM_SIZE"
          require azure_availability_zone "$RUNNERSCOUT_QUALIFY_AZURE_ZONE"
          lc() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          if ! [[ "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::azure_subscription_id ('$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID') does not look like a subscription GUID"
            exit 1
          fi
          # Mirrors the GCP step's own vars.GCP_QUALIFICATION_PROJECT_ID
          # check: the federated identity is only ever trusted to act in one
          # subscription, so requiring azure_subscription_id as its own
          # input (rather than silently defaulting to the variable) keeps it
          # an explicit, pinned, operator-supplied value per issue #3's
          # "pinned images/networks" wording, while this check catches a
          # pasted-wrong-subscription mistake before any credential is
          # configured.
          if [ -z "$RUNNERSCOUT_QUALIFY_EXPECTED_SUBSCRIPTION_ID" ]; then
            echo "::error::vars.AZURE_QUALIFICATION_SUBSCRIPTION_ID is not set - this repository has no Azure qualification identity provisioned yet; see docs/qualification-real-cloud.md's Azure section for what an operator must provision first"
            exit 1
          fi
          if [ "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID" != "$RUNNERSCOUT_QUALIFY_EXPECTED_SUBSCRIPTION_ID" ]; then
            echo "::error::azure_subscription_id ('$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID') does not match the provisioned qualification identity's subscription (vars.AZURE_QUALIFICATION_SUBSCRIPTION_ID) - refusing to proceed"
            exit 1
          fi
          case "$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP" in
            "" | */*) echo "::error::azure_resource_group ('$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP') must be a non-empty name with no '/'"; exit 1 ;;
          esac
          check_arm_id() {
            name="$1"; value="$2"; want_type="$3"
            prefix="$(lc "/subscriptions/$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID/resourcegroups/$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP/providers/$want_type/")"
            case "$(lc "$value")" in
              "$prefix"*) ;;
              *) echo "::error::$name ('$value') does not look like a $want_type resource ID under subscription $RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID, resource group $RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP"; exit 1 ;;
            esac
          }
          check_arm_id azure_nsg_id "$RUNNERSCOUT_QUALIFY_AZURE_NSG_ID" "microsoft.network/networksecuritygroups"
          check_arm_id azure_image_id "$RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID" "microsoft.compute/images"
          # azure_vnet_id is not its own input (see the job env comment
          # above) - it is exactly azure_subnet_id's own path up to and
          # excluding "/subnets/<name>", so derive it here rather than
          # trusting a second, separately-pasted value that could
          # structurally mismatch.
          case "$RUNNERSCOUT_QUALIFY_AZURE_SUBNET_ID" in
            */subnets/*) ;;
            *) echo "::error::azure_subnet_id ('$RUNNERSCOUT_QUALIFY_AZURE_SUBNET_ID') does not contain '/subnets/' - cannot derive its parent VNet resource ID"; exit 1 ;;
          esac
          derived_vnet_id="${RUNNERSCOUT_QUALIFY_AZURE_SUBNET_ID%/subnets/*}"
          check_arm_id azure_vnet_id "$derived_vnet_id" "microsoft.network/virtualnetworks"
          echo "RUNNERSCOUT_QUALIFY_AZURE_VNET_ID=$derived_vnet_id" >> "$GITHUB_ENV"

      - name: "[GCP] Validate pinned project against the provisioned qualification identity"
        if: matrix.provider == 'gcp'
        # Cheap, local, no GCP call: the WIF service account is only ever
        # trusted to act in one project. Requiring gcp_project as its own
        # input (rather than silently defaulting to the variable) keeps it
        # an explicit, pinned, operator-supplied value per issue #3's
        # "pinned images/networks" wording, while this check catches a
        # pasted-wrong-project mistake before any credential is configured.
        # Also enforces that every GCP-specific input is actually present
        # (see the AWS step's own comment on why this is where "required
        # for GCP" is enforced).
        env:
          RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT: ${{ vars.GCP_QUALIFICATION_PROJECT_ID }}
        run: |
          set -euo pipefail
          require() { [ -n "$2" ] || { echo "::error::$1 is required when provider is gcp or all"; exit 1; }; }
          require gcp_project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT"
          require gcp_region "$RUNNERSCOUT_QUALIFY_GCP_REGION"
          require gcp_zone "$RUNNERSCOUT_QUALIFY_GCP_ZONE"
          require gcp_network "$RUNNERSCOUT_QUALIFY_GCP_NETWORK"
          require gcp_subnetwork "$RUNNERSCOUT_QUALIFY_GCP_SUBNETWORK"
          require gcp_image "$RUNNERSCOUT_QUALIFY_GCP_IMAGE"
          require gcp_machine_type "$RUNNERSCOUT_QUALIFY_GCP_MACHINE_TYPE"
          if [ -z "$RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT" ]; then
            echo "::error::vars.GCP_QUALIFICATION_PROJECT_ID is not set - this repository has no GCP qualification identity provisioned yet; see docs/qualification-real-cloud.md's GCP section for what an operator must provision first"
            exit 1
          fi
          if [ "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" != "$RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT" ]; then
            echo "::error::gcp_project ('$RUNNERSCOUT_QUALIFY_GCP_PROJECT') does not match the provisioned qualification identity's project (vars.GCP_QUALIFICATION_PROJECT_ID) - refusing to proceed"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}

      - name: "[AWS] Determine credential mode"
        if: matrix.provider == 'aws'
        id: aws_credmode
        # OIDC-preferred: if the operator has set the AWS_QUALIFICATION_ROLE_ARN
        # repository secret, assume that role via OIDC. Otherwise fall back
        # to the static-key secrets. Exactly one of the two
        # configure-aws-credentials steps below runs.
        env:
          RUNNERSCOUT_QUALIFY_ROLE_ARN: ${{ secrets.AWS_QUALIFICATION_ROLE_ARN }}
        run: |
          if [ -n "$RUNNERSCOUT_QUALIFY_ROLE_ARN" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=static" >> "$GITHUB_OUTPUT"
          fi
      - name: "[AWS] Configure credentials (OIDC role assumption)"
        if: matrix.provider == 'aws' && steps.aws_credmode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_QUALIFICATION_ROLE_ARN }}
          role-session-name: runnerscout-qualify-aws-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
      - name: "[AWS] Configure credentials (static key fallback)"
        if: matrix.provider == 'aws' && steps.aws_credmode.outputs.mode == 'static'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_QUALIFICATION_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_QUALIFICATION_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}

      - name: "[AWS] Resolve account identity and cross-validate pinned network identifiers"
        if: matrix.provider == 'aws'
        # All read-only DescribeX/GetCallerIdentity calls - no resource is
        # created by this step.
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if ! [[ "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::unexpected AWS account id shape from STS: '$account_id'"
            exit 1
          fi
          subnet_vpc="$(aws ec2 describe-subnets --region "$RUNNERSCOUT_QUALIFY_AWS_REGION" --subnet-ids "$RUNNERSCOUT_QUALIFY_AWS_SUBNET" --query 'Subnets[0].VpcId' --output text)"
          zone="$(aws ec2 describe-subnets --region "$RUNNERSCOUT_QUALIFY_AWS_REGION" --subnet-ids "$RUNNERSCOUT_QUALIFY_AWS_SUBNET" --query 'Subnets[0].AvailabilityZone' --output text)"
          sg_vpc="$(aws ec2 describe-security-groups --region "$RUNNERSCOUT_QUALIFY_AWS_REGION" --group-ids "$RUNNERSCOUT_QUALIFY_AWS_SECURITY_GROUP" --query 'SecurityGroups[0].VpcId' --output text)"
          if [ "$subnet_vpc" != "$RUNNERSCOUT_QUALIFY_AWS_VPC" ] || [ "$sg_vpc" != "$RUNNERSCOUT_QUALIFY_AWS_VPC" ]; then
            echo "::error::subnet $RUNNERSCOUT_QUALIFY_AWS_SUBNET (vpc $subnet_vpc) and/or security group $RUNNERSCOUT_QUALIFY_AWS_SECURITY_GROUP (vpc $sg_vpc) do not both belong to the pinned aws_vpc_id $RUNNERSCOUT_QUALIFY_AWS_VPC - refusing to proceed"
            exit 1
          fi
          # Unprefixed names: these are exactly what
          # internal/provider/aws_realcloud_test.go's loadQualifyAWSEnv
          # reads via os.Getenv, matching the original qualify-aws.yml.
          {
            echo "RUNNERSCOUT_QUALIFY_ACCOUNT_ID=$account_id"
            echo "RUNNERSCOUT_QUALIFY_ZONE=$zone"
          } >> "$GITHUB_ENV"

      - name: "[Azure] Confirm OIDC credentials are provisioned"
        if: matrix.provider == 'azure'
        # Explicit, clear failure before any Azure interaction - Azure
        # Workload Identity Federation is the ONLY supported credential path
        # here, so there is no fallback branch to fall through to the way
        # AWS has one.
        env:
          RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID: ${{ vars.AZURE_QUALIFICATION_CLIENT_ID }}
          RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID: ${{ vars.AZURE_QUALIFICATION_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID" ] || [ -z "$RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_QUALIFICATION_CLIENT_ID and AZURE_QUALIFICATION_TENANT_ID repository variables must both be set - see docs/qualification-real-cloud.md's Azure section for what to provision (an Azure AD app registration with a federated credential trusting this repository's GitHub Actions OIDC issuer) before dispatching this workflow"
            exit 1
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.provider == 'azure'
        with:
          client-id: ${{ vars.AZURE_QUALIFICATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_QUALIFICATION_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id }}
          allow-no-subscriptions: false

      - name: "[Azure] Resolve subscription identity and cross-validate pinned network identifiers"
        if: matrix.provider == 'azure'
        # All read-only `az resource show`/`az account show` calls - no
        # resource is created by this step.
        run: |
          set -euo pipefail
          account_id="$(az account show --query id -o tsv)"
          if [ "$account_id" != "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::az login resolved subscription '$account_id', expected '$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID'"
            exit 1
          fi
          for id in "$RUNNERSCOUT_QUALIFY_AZURE_VNET_ID" "$RUNNERSCOUT_QUALIFY_AZURE_SUBNET_ID" "$RUNNERSCOUT_QUALIFY_AZURE_NSG_ID" "$RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID"; do
            rg="$(az resource show --ids "$id" --query resourceGroup -o tsv)"
            if [ "$(printf '%s' "$rg" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP" | tr '[:upper:]' '[:lower:]')" ]; then
              echo "::error::resource '$id' belongs to resource group '$rg', not the pinned azure_resource_group '$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP' - refusing to proceed"
              exit 1
            fi
          done

      - name: "[Azure] Fetch GitHub OIDC token for the Go test's Workload Identity Federation"
        if: matrix.provider == 'azure'
        # Independent of azure/login above: that action only authenticates
        # the `az` CLI session used by this job's own steps, and does not
        # export any token or file a downstream Go SDK could reuse. This
        # step performs its own, separate GitHub OIDC token exchange, using
        # the exact "api://AzureADTokenExchange" audience an Azure AD app
        # registration's federated credential expects from GitHub Actions.
        # ACTIONS_ID_TOKEN_REQUEST_URL/ACTIONS_ID_TOKEN_REQUEST_TOKEN are
        # ambient runner-provided variables (from the id-token: write
        # permission above), not operator-supplied input.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::no GitHub OIDC token endpoint available - id-token: write permission missing"
            exit 1
          fi
          token_file="${RUNNER_TEMP}/azure-federated-token.jwt"
          curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$token_file"
          if [ ! -s "$token_file" ] || grep -qx null "$token_file"; then
            echo "::error::failed to obtain a GitHub OIDC token for Azure Workload Identity Federation"
            exit 1
          fi
          {
            echo "AZURE_CLIENT_ID=$RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID"
            echo "AZURE_TENANT_ID=$RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID"
            echo "AZURE_FEDERATED_TOKEN_FILE=$token_file"
          } >> "$GITHUB_ENV"
        env:
          RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID: ${{ vars.AZURE_QUALIFICATION_CLIENT_ID }}
          RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID: ${{ vars.AZURE_QUALIFICATION_TENANT_ID }}

      - name: "[GCP] Authenticate (Workload Identity Federation)"
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_QUALIFICATION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_QUALIFICATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_QUALIFICATION_SERVICE_ACCOUNT }}
          # export_environment_variables defaults true: this exports
          # GOOGLE_APPLICATION_CREDENTIALS/CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
          # pointing at the same generated credential file - exactly the
          # environment shape internal/provider/gcp_credentials.go's
          # gcpCredential already reads from a nil environment map.

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: matrix.provider == 'gcp'
        with:
          version: ">= 480.0.0"

      - name: "[GCP] Cross-validate pinned network identifiers and image"
        if: matrix.provider == 'gcp'
        # All read-only `gcloud ... describe` calls - no resource is created
        # by this step.
        run: |
          set -euo pipefail
          zone_region="$(gcloud compute zones describe "$RUNNERSCOUT_QUALIFY_GCP_ZONE" --project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" --format='value(region.basename())')"
          if [ "$zone_region" != "$RUNNERSCOUT_QUALIFY_GCP_REGION" ]; then
            echo "::error::gcp_zone '$RUNNERSCOUT_QUALIFY_GCP_ZONE' belongs to region '$zone_region', not the pinned gcp_region '$RUNNERSCOUT_QUALIFY_GCP_REGION' - refusing to proceed"
            exit 1
          fi
          subnet_network="$(gcloud compute networks subnets describe "$RUNNERSCOUT_QUALIFY_GCP_SUBNETWORK" --project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" --region "$RUNNERSCOUT_QUALIFY_GCP_REGION" --format='value(network.basename())')"
          if [ "$subnet_network" != "$RUNNERSCOUT_QUALIFY_GCP_NETWORK" ]; then
            echo "::error::gcp_subnetwork '$RUNNERSCOUT_QUALIFY_GCP_SUBNETWORK' (region $RUNNERSCOUT_QUALIFY_GCP_REGION) belongs to network '$subnet_network', not the pinned gcp_network '$RUNNERSCOUT_QUALIFY_GCP_NETWORK' - refusing to proceed"
            exit 1
          fi
          if ! gcloud compute images describe "$RUNNERSCOUT_QUALIFY_GCP_IMAGE" --project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" >/dev/null 2>&1; then
            echo "::error::gcp_image '$RUNNERSCOUT_QUALIFY_GCP_IMAGE' could not be resolved in project '$RUNNERSCOUT_QUALIFY_GCP_PROJECT' - refusing to proceed"
            exit 1
          fi

      - name: "[AWS] Real-provider qualification (creates ONE real billed Spot instance)"
        if: matrix.provider == 'aws'
        # -tags realcloud selects internal/provider/aws_realcloud_test.go,
        # kept out of every other build/test path. -timeout is deliberately
        # larger than the create/observe/price budget above: that file's own
        # teardown runs on a separate, fixed 5-minute deadline that must not
        # be preempted by go test's own timeout while cleanup is still in
        # progress.
        run: |
          # 10#... forces base-10 arithmetic regardless of leading zeros in
          # the input (bash's $(( )) otherwise treats a leading 0 as octal).
          go test -tags realcloud -run '^TestQualifyRealAWSSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/
        env:
          RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.aws_region }}
          RUNNERSCOUT_QUALIFY_VPC: ${{ inputs.aws_vpc_id }}
          RUNNERSCOUT_QUALIFY_AMI: ${{ inputs.aws_ami_id }}
          RUNNERSCOUT_QUALIFY_SUBNET: ${{ inputs.aws_subnet_id }}
          RUNNERSCOUT_QUALIFY_SECURITY_GROUP: ${{ inputs.aws_security_group_id }}
          RUNNERSCOUT_QUALIFY_INSTANCE_TYPE: ${{ inputs.aws_instance_type }}
          RUNNERSCOUT_QUALIFY_ARCHITECTURE: ${{ inputs.aws_architecture }}

      - name: "[Azure] Real-provider qualification (creates ONE real billed Spot VM)"
        if: matrix.provider == 'azure'
        # -tags realcloud selects internal/provider/azure_realcloud_test.go.
        run: |
          go test -tags realcloud -run '^TestQualifyRealAzureSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/
        env:
          RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.azure_region }}
          RUNNERSCOUT_QUALIFY_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
          RUNNERSCOUT_QUALIFY_RESOURCE_GROUP: ${{ inputs.azure_resource_group }}
          # No RUNNERSCOUT_QUALIFY_VNET_ID here: azure_realcloud_test.go
          # never reads it (only RUNNERSCOUT_QUALIFY_SUBNET_ID) - it was
          # unused dead plumbing even in the original qualify-azure.yml.
          RUNNERSCOUT_QUALIFY_SUBNET_ID: ${{ inputs.azure_subnet_id }}
          RUNNERSCOUT_QUALIFY_NSG_ID: ${{ inputs.azure_nsg_id }}
          RUNNERSCOUT_QUALIFY_IMAGE_ID: ${{ inputs.azure_image_id }}
          RUNNERSCOUT_QUALIFY_VM_SIZE: ${{ inputs.azure_vm_size }}
          RUNNERSCOUT_QUALIFY_ZONE: ${{ inputs.azure_availability_zone }}

      - name: "[GCP] Real-provider qualification (creates ONE real billed Spot instance)"
        if: matrix.provider == 'gcp'
        # -tags realcloud selects internal/provider/gcp_realcloud_test.go,
        # living alongside, not replacing, aws_realcloud_test.go/
        # azure_realcloud_test.go.
        run: |
          go test -tags realcloud -run '^TestQualifyRealGCPSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/
        env:
          RUNNERSCOUT_QUALIFY_PROJECT: ${{ inputs.gcp_project }}
          RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.gcp_region }}
          RUNNERSCOUT_QUALIFY_ZONE: ${{ inputs.gcp_zone }}
          RUNNERSCOUT_QUALIFY_NETWORK: ${{ inputs.gcp_network }}
          RUNNERSCOUT_QUALIFY_SUBNETWORK: ${{ inputs.gcp_subnetwork }}
          RUNNERSCOUT_QUALIFY_IMAGE: ${{ inputs.gcp_image }}
          RUNNERSCOUT_QUALIFY_MACHINE_TYPE: ${{ inputs.gcp_machine_type }}

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualify-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNNERSCOUT_QUALIFY_EVIDENCE_DIR }}/
          # warn, not error: a run that fails before the qualification test
          # ever starts (e.g. bad confirm_real_spend, bad runtime ceiling)
          # legitimately produces no evidence directory at all - that is a
          # correct outcome, not a bug to surface loudly.
          if-no-files-found: warn
          retention-days: 14

      - name: "[AWS] Independent post-run cleanup safety net"
        if: always() && matrix.provider == 'aws'
        # THE authoritative teardown guarantee: runs via if: always(), so it
        # executes even if the step above was killed by the job timeout or
        # cancelled, in which case the Go test's own in-process t.Cleanup
        # teardown may never have run at all. This step re-derives
        # everything it needs from job env/inputs directly (never from a
        # prior step's output), so it works even when every earlier step
        # failed or was skipped - including the case where credentials were
        # never configured, handled by the guard below.
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "AWS credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          region="$RUNNERSCOUT_QUALIFY_AWS_REGION"
          allocation="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          owner="runnerscout-qualify-aws"
          echo "Independent post-run inventory sweep for allocation $allocation in $region (owner tag $owner)"
          leftover=0

          # shellcheck disable=SC2016  # backticks below are JMESPath literal syntax, not shell command substitution - this whole --query argument is single-quoted precisely so the shell never touches it.
          instances="$(aws ec2 describe-instances --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'Reservations[].Instances[?State.Name!=`terminated`].InstanceId' --output text)"
          if [ -n "$instances" ]; then
            leftover=1
            echo "::warning::leftover AWS instance(s) not terminated by the qualification job: $instances - force-terminating now"
            # shellcheck disable=SC2086  # intentionally unquoted: --instance-ids takes one argument per id, and $instances is AWS CLI's own space-separated --output text list.
            aws ec2 terminate-instances --region "$region" --instance-ids $instances || true
          fi

          # shellcheck disable=SC2016  # see the describe-instances --query above: JMESPath literal, not shell expansion.
          volumes="$(aws ec2 describe-volumes --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'Volumes[?State!=`deleted`].VolumeId' --output text)"
          if [ -n "$volumes" ]; then
            leftover=1
            echo "::warning::leftover AWS volume(s): $volumes"
            for v in $volumes; do aws ec2 delete-volume --region "$region" --volume-id "$v" || true; done
          fi

          enis="$(aws ec2 describe-network-interfaces --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
          if [ -n "$enis" ]; then
            leftover=1
            echo "::warning::leftover AWS network interface(s): $enis"
            for e in $enis; do aws ec2 delete-network-interface --region "$region" --network-interface-id "$e" || true; done
          fi

          if [ "$leftover" -eq 1 ]; then
            echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
            exit 1
          fi
          echo "Independent inventory confirms zero leftover billable resources for allocation $allocation."

      - name: "[Azure] Independent post-run cleanup safety net"
        if: always() && matrix.provider == 'azure'
        # Reuses the `az` CLI session azure/login already established
        # earlier in this same job (that login persists for the whole job,
        # not just its own step) rather than re-deriving Go SDK credentials.
        run: |
          set -euo pipefail
          if ! az account show >/dev/null 2>&1; then
            echo "Azure credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          rg="$RUNNERSCOUT_QUALIFY_AZURE_RESOURCE_GROUP"
          alloc="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          echo "Independent post-run inventory sweep for allocation $alloc in resource group $rg"
          leftover_ids="$(az resource list --resource-group "$rg" --tag runnerscout-operation="$alloc" --query '[].id' -o tsv)"
          if [ -z "$leftover_ids" ]; then
            echo "Independent inventory confirms zero leftover billable resources for allocation $alloc."
            exit 0
          fi
          echo "::warning::leftover Azure resource(s) not deleted by the qualification job: $leftover_ids - force-cleaning now"
          # Delete VMs first: a NIC or disk still attached to a VM refuses
          # deletion until the VM itself is gone, mirroring deleteAzure's
          # own VM-then-NIC-then-disk priority order (azure.go).
          vm_ids="$(az resource list --resource-group "$rg" --tag runnerscout-operation="$alloc" --resource-type Microsoft.Compute/virtualMachines --query '[].id' -o tsv)"
          for id in $vm_ids; do az resource delete --ids "$id" --verbose || true; done
          remaining_ids="$(az resource list --resource-group "$rg" --tag runnerscout-operation="$alloc" --query '[].id' -o tsv)"
          for id in $remaining_ids; do az resource delete --ids "$id" --verbose || true; done
          echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
          exit 1

      - name: "[GCP] Independent post-run cleanup safety net"
        if: always() && matrix.provider == 'gcp'
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "GCP credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          if ! command -v gcloud >/dev/null 2>&1; then
            echo "::warning::gcloud CLI unavailable this run (setup-gcloud step never ran) - cannot independently sweep for leftover GCP resources"
            exit 0
          fi
          project="$RUNNERSCOUT_QUALIFY_GCP_PROJECT"
          zone="$RUNNERSCOUT_QUALIFY_GCP_ZONE"
          region="$RUNNERSCOUT_QUALIFY_GCP_REGION"
          allocation="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          owner="runnerscout-qualify-gcp"
          filter="labels.runnerscout-owner=$owner AND labels.runnerscout-operation=$allocation"
          echo "Independent post-run inventory sweep for allocation $allocation in $project/$zone (owner label $owner)"
          leftover=0

          instances="$(gcloud compute instances list --project "$project" --zones "$zone" --filter "$filter" --format='value(name)')"
          if [ -n "$instances" ]; then
            leftover=1
            echo "::warning::leftover GCP instance(s) not deleted by the qualification job: $instances - force-deleting now"
            for i in $instances; do gcloud compute instances delete "$i" --project "$project" --zone "$zone" --quiet || true; done
          fi

          disks="$(gcloud compute disks list --project "$project" --zones "$zone" --filter "$filter" --format='value(name)')"
          if [ -n "$disks" ]; then
            leftover=1
            echo "::warning::leftover GCP disk(s): $disks"
            for d in $disks; do gcloud compute disks delete "$d" --project "$project" --zone "$zone" --quiet || true; done
          fi

          addresses="$(gcloud compute addresses list --project "$project" --regions "$region" --filter "$filter" --format='value(name)')"
          if [ -n "$addresses" ]; then
            leftover=1
            echo "::warning::leftover GCP reserved address(es): $addresses"
            for a in $addresses; do gcloud compute addresses delete "$a" --project "$project" --region "$region" --quiet || true; done
          fi

          if [ "$leftover" -eq 1 ]; then
            echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
            exit 1
          fi
          echo "Independent inventory confirms zero leftover billable resources for allocation $allocation."
