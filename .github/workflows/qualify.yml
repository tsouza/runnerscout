# Real-cloud provider qualification (issue #3's "Final real-cloud
# qualification" scope, plus issue #89's network-provisioning fold-in). One
# matrixed workflow, one dispatch per provider (or `all` for every
# provider), that for each selected provider: provisions a fresh, isolated
# qualification network via OpenTofu, runs the real-cloud Go test against
# it, and destroys that network again - all within the same job run. See
# docs/qualification-real-cloud.md for the current procedural description
# and docs/qualification-real-cloud.background.md for why each provider's
# checks look the way they do.
#
# This workflow provisions ONE real, billed compute instance (plus, for
# AWS, a real, billed NAT Gateway for the duration of this same run) per
# selected provider through the production internal/provider adapter for
# that cloud (never modified by this workflow or its accompanying
# *_realcloud_test.go files) and independently verifies both the instance
# and its network are fully torn down afterward. It is the only automation
# in this repository that spends real money when it runs, so every design
# choice is biased toward "impossible to trigger by accident" over
# convenience:
#
#   - workflow_dispatch is the ONLY trigger. No schedule, no push, no
#     pull_request. A human must explicitly run this, every time, with these
#     specific inputs - that act IS the confirmation, for both halves of
#     this workflow (the network provisioning and the real, billed compute
#     instance alike). There is no separate "type an exact phrase" gate on
#     top of that: a human choosing to dispatch this workflow, with these
#     inputs, already knows what it does - a second confirmation input would
#     only add friction to the one path a human already had to take
#     deliberately, never protection against anything workflow_dispatch
#     itself doesn't already guard against. (See issue #89's own history for
#     the same reasoning applied to the network half: a separately-exposed
#     provision/destroy workflow was tried first and rejected as
#     unnecessary indirection.)
#   - `max_runtime_minutes` is a required, explicit numeric VM-time bound -
#     issue #3's own "numeric spend/VM-time allocation" wording - validated
#     against a hard-coded workflow ceiling
#     (RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES below) that no input
#     value can exceed, shared across all three providers. The job's own
#     `timeout-minutes:` is a second, independent, non-input-derived
#     ceiling on the whole job.
#   - The pinned image and compute shape (AMI/instance type/architecture;
#     managed image/VM size/availability zone; boot image/machine type) are
#     required-for-that-provider operator-supplied inputs - this workflow
#     never discovers or selects any of them dynamically. The NETWORK
#     itself is no longer an operator-pinned input (see "Network
#     provisioning" below) - only the compute side stays pinned, since
#     issue #3's "pinned images/networks" wording was about avoiding
#     accidentally reusing a wrong or shared pre-existing resource, and a
#     network this workflow creates fresh and owns exclusively for the
#     duration of one run cannot be an ambiguous, possibly-shared resource
#     the way a pre-existing pasted-in identifier could be.
#   - Teardown/independent-verification runs via `if: always()` (the final
#     steps of each provider's steps), exactly like this repo's other CI
#     jobs already do for evidence upload - a failed or killed run must
#     never leave a running, billable VM or network behind. This is the
#     authoritative backstop: it survives even a job-level timeout or
#     cancellation that would kill the Go test process (and therefore skip
#     its own in-process t.Cleanup) before it could finish tearing down.
#     Network teardown runs after VM-level teardown, in the same order they
#     were created, since a NAT Gateway/VPC/VNet/network cannot be deleted
#     while a VM or NIC still sits inside it.
#   - `provider: all` (the default) fans out to all three providers as
#     independent matrix jobs (fail-fast: false, so one provider's failure
#     never cancels another's in-flight teardown); `provider: aws` (etc.)
#     runs only that one. Each provider keeps its own concurrency group, so
#     a second dispatch against the same provider queues behind an
#     in-flight one instead of racing it for the same OpenTofu state file -
#     but the three providers themselves remain independent and can run
#     concurrently within a single `provider: all` dispatch.
#
# Network provisioning (issue #89): each provider's qualification network
# (AWS VPC/subnet/NAT Gateway/security group; Azure resource group/VNet/
# subnet/NSG; GCP VPC network/subnetwork) is created via
# `tools/tofu/qualify-network/<provider>/` at the start of that provider's
# job and destroyed at the end of the SAME job - never left standing
# between runs, never provisioned by a separate workflow dispatch an
# operator would have to sequence by hand. OpenTofu's local state for this
# never needs to leave the job's own filesystem, since apply and destroy
# both run in the same job: no remote backend, no cross-run artifact
# handoff, is needed. See docs/qualification-real-cloud.background.md for
# the fuller history (why a separate provision/destroy workflow was tried
# first and reverted).
#
# A DELIBERATELY SEPARATE, least-privilege identity per cloud provisions
# and destroys the network - never `AWS_QUALIFICATION_ROLE_ARN`/
# `AZURE_QUALIFICATION_CLIENT_ID`+`AZURE_QUALIFICATION_TENANT_ID`/
# `GCP_QUALIFICATION_*`, which are scoped to launch/observe/delete a VM
# into a *pre-existing* network only (confirmed against the actual
# provisioned Azure custom role, which has no
# `Microsoft.Network/virtualNetworks/write`) - widening those identities to
# also create/delete networks would permanently grow a purpose-built
# least-privilege identity's blast radius. See
# docs/qualification-real-cloud.background.md for what each
# `NETWORK_PROVISIONER_*` identity's minimum required permissions are.
#
# Credentials, per provider, for the QUALIFICATION identity (unchanged from
# before issue #89):
#   - AWS: OIDC role assumption (aws-actions/configure-aws-credentials with
#     role-to-assume) is preferred; a static-key fallback
#     (AWS_QUALIFICATION_ACCESS_KEY_ID/AWS_QUALIFICATION_SECRET_ACCESS_KEY
#     secrets) is also supported. See docs/qualification-real-cloud.background.md's
#     "Why OIDC and the static-key fallback were both built, not deferred".
#   - Azure: Workload Identity Federation (OIDC) is the ONLY supported path
#     - no client-secret fallback. AZURE_QUALIFICATION_CLIENT_ID/
#     AZURE_QUALIFICATION_TENANT_ID/AZURE_QUALIFICATION_SUBSCRIPTION_ID are
#     repository VARIABLES, not secrets (see docs/qualification-real-cloud.background.md's
#     Azure section for why).
#   - GCP: Workload Identity Federation only
#     (google-github-actions/auth with workload_identity_provider +
#     service_account) - deliberately no service account key JSON fallback
#     (see docs/qualification-real-cloud.background.md's GCP section).
# The NETWORK_PROVISIONER identity for each cloud uses the equivalent OIDC/
# WIF mechanism, under `AWS_NETWORK_PROVISIONER_ROLE_ARN` (secret) /
# `AZURE_NETWORK_PROVISIONER_CLIENT_ID`+`AZURE_NETWORK_PROVISIONER_TENANT_ID`+
# `AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID` (variables) /
# `GCP_NETWORK_PROVISIONER_PROJECT_ID`+`GCP_NETWORK_PROVISIONER_SERVICE_ACCOUNT`+
# `GCP_NETWORK_PROVISIONER_WORKLOAD_IDENTITY_PROVIDER` (variables).
name: Qualify (real cloud)
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Which provider(s) to qualify. "all" fans out to AWS, Azure and GCP as independent matrix jobs.
        required: true
        type: choice
        default: all
        options:
          - all
          - aws
          - azure
          - gcp
      max_runtime_minutes:
        description: Hard VM-time bound for the create/observe/price phase, as a plain integer, shared across every selected provider. Must be between 1 and 20 (workflow-enforced ceiling) - see this workflow's own header comment.
        required: true
        type: string
      aws_region:
        description: "[AWS] Pinned AWS region to qualify against (e.g. us-east-1) - also where the qualification network is created/destroyed. Required only when provider is aws or all."
        required: false
        type: string
      aws_ami_id:
        description: "[AWS] Pinned AMI id (ami-...) to launch. Must be available, EBS-backed, and match aws_architecture."
        required: false
        type: string
      aws_instance_type:
        description: "[AWS] EC2 instance type (e.g. t3.micro / t4g.micro). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes."
        required: false
        type: string
      aws_architecture:
        description: "[AWS] Must match aws_ami_id's real architecture."
        required: false
        type: choice
        default: unset
        options:
          - unset
          - amd64
          - arm64
      azure_region:
        description: "[Azure] Pinned Azure region to qualify against (e.g. eastus) - also where the qualification network is created/destroyed. Required only when provider is azure or all."
        required: false
        type: string
      azure_subscription_id:
        description: "[Azure] Pinned Azure subscription GUID to qualify against."
        required: false
        type: string
      azure_image_id:
        description: "[Azure] Pinned managed-image resource ID (Microsoft.Compute/images/...). Must be an available, generalized Linux image with only an OS disk."
        required: false
        type: string
      azure_vm_size:
        description: "[Azure] Azure VM size (e.g. Standard_D2s_v3). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes."
        required: false
        type: string
      azure_availability_zone:
        description: "[Azure] Pinned Azure Availability Zone for the VM. Must be supported by both azure_region and azure_vm_size."
        required: false
        type: choice
        default: unset
        options:
          - unset
          - "1"
          - "2"
          - "3"
      azure_disk_controller_type:
        description: >-
          [Azure] Optional. Leave "unset" for Azure's own default
          controller-type inference (correct for most VM sizes). Set to
          "NVMe" or "SCSI" only if azure_vm_size requires a specific
          controller type a classic managed image's own metadata doesn't
          declare - see docs/qualification-real-cloud.md's Azure section.
        required: false
        type: choice
        default: unset
        options:
          - unset
          - NVMe
          - SCSI
      gcp_project:
        description: "[GCP] Pinned GCP project id to qualify against. Must equal both vars.GCP_QUALIFICATION_PROJECT_ID and vars.GCP_NETWORK_PROVISIONER_PROJECT_ID. Required only when provider is gcp or all."
        required: false
        type: string
      gcp_region:
        description: "[GCP] Pinned GCP region to qualify against (e.g. us-central1) - also where the qualification network is created/destroyed."
        required: false
        type: string
      gcp_zone:
        description: "[GCP] Pinned GCP zone (e.g. us-central1-a). Must belong to gcp_region."
        required: false
        type: string
      gcp_image:
        description: >-
          [GCP] Pinned boot image, as an exact image self-link (e.g.
          projects/debian-cloud/global/images/debian-12-bookworm-v20250910 -
          look up the current name with `gcloud compute images list
          --project debian-cloud --filter="family=debian-12"`). NEVER a
          rolling family reference (.../images/family/debian-12).
        required: false
        type: string
      gcp_machine_type:
        description: "[GCP] GCE machine type (e.g. e2-micro). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes."
        required: false
        type: string
permissions:
  contents: read
jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      providers: ${{ steps.plan.outputs.providers }}
    steps:
      - id: plan
        run: |
          set -euo pipefail
          case "${{ inputs.provider }}" in
            all) echo 'providers=["aws","azure","gcp"]' >> "$GITHUB_OUTPUT" ;;
            aws|azure|gcp) echo "providers=[\"${{ inputs.provider }}\"]" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::provider must be one of: all, aws, azure, gcp - got '${{ inputs.provider }}'"; exit 1 ;;
          esac

  qualify:
    name: qualify (${{ matrix.provider }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.plan.outputs.providers) }}
    concurrency:
      # A second dispatch against the same provider queues behind an
      # in-flight one rather than racing it for the same OpenTofu state
      # file. cancel-in-progress is deliberately false - cancelling a run
      # that is mid-teardown of a real billed instance/network is strictly
      # worse than making the next run wait. Providers remain independent.
      group: qualify-${{ matrix.provider }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Hard-coded, independent of max_runtime_minutes: setup/build (~5m) +
    # network apply/destroy (~5m, mostly AWS's NAT Gateway provisioning
    # time) + the go test step's own worst-case -timeout below
    # (max_runtime_minutes's 20m ceiling + 10m, i.e. 30m, which already
    # includes the test's own fixed 5m teardown budget) + margin. No input
    # can raise this.
    timeout-minutes: 45
    permissions:
      contents: read
      # Consumed by both identities' credential steps for this matrix job
      # (qualification and network-provisioner OIDC/WIF, whichever
      # provider's steps actually run).
      id-token: write
    env:
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES: "20"
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
      RUNNERSCOUT_QUALIFY_ALLOCATION_ID: qualify-${{ matrix.provider }}-${{ github.run_id }}
      RUNNERSCOUT_QUALIFY_EVIDENCE_DIR: evidence/qualify-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
      # AWS
      RUNNERSCOUT_QUALIFY_AWS_REGION: ${{ inputs.aws_region }}
      RUNNERSCOUT_QUALIFY_AWS_AMI: ${{ inputs.aws_ami_id }}
      RUNNERSCOUT_QUALIFY_AWS_INSTANCE_TYPE: ${{ inputs.aws_instance_type }}
      RUNNERSCOUT_QUALIFY_AWS_ARCHITECTURE: ${{ inputs.aws_architecture }}
      # Azure
      RUNNERSCOUT_QUALIFY_AZURE_REGION: ${{ inputs.azure_region }}
      RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
      RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID: ${{ inputs.azure_image_id }}
      RUNNERSCOUT_QUALIFY_AZURE_VM_SIZE: ${{ inputs.azure_vm_size }}
      RUNNERSCOUT_QUALIFY_AZURE_ZONE: ${{ inputs.azure_availability_zone }}
      # GCP
      RUNNERSCOUT_QUALIFY_GCP_PROJECT: ${{ inputs.gcp_project }}
      RUNNERSCOUT_QUALIFY_GCP_REGION: ${{ inputs.gcp_region }}
      RUNNERSCOUT_QUALIFY_GCP_ZONE: ${{ inputs.gcp_zone }}
      RUNNERSCOUT_QUALIFY_GCP_IMAGE: ${{ inputs.gcp_image }}
      RUNNERSCOUT_QUALIFY_GCP_MACHINE_TYPE: ${{ inputs.gcp_machine_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate numeric runtime ceiling
        # Deliberately the very first step, before Go setup and before any
        # cloud credential is configured: an out-of-bound runtime request
        # must fail with zero cloud interaction of any kind, not even a
        # read-only one. Shared across all three providers.
        run: |
          set -euo pipefail
          max="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES"
          ceiling="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES"
          if ! [[ "$max" =~ ^[0-9]+$ ]] || [ "$max" -lt 1 ] || [ "$max" -gt "$ceiling" ]; then
            echo "::error::max_runtime_minutes must be a plain integer between 1 and $ceiling (hard-coded workflow ceiling); got '$max'"
            exit 1
          fi

      - name: "[AWS] Validate pinned compute inputs"
        if: matrix.provider == 'aws'
        # Cheap, local, no AWS call: enforces that every AWS-specific input
        # is actually present - workflow_dispatch cannot make an input
        # conditionally required on provider's value, so this step is
        # where "required for AWS" is actually enforced. Network
        # identifiers are no longer inputs here (see this workflow's own
        # header comment) - only the compute shape stays pinned.
        run: |
          set -euo pipefail
          # "unset" is aws_architecture's own sentinel default (choice
          # inputs cannot have an empty-string option) - treated the same
          # as genuinely empty.
          require() { [ -n "$2" ] && [ "$2" != "unset" ] || { echo "::error::$1 is required when provider is aws or all"; exit 1; }; }
          require aws_region "$RUNNERSCOUT_QUALIFY_AWS_REGION"
          require aws_ami_id "$RUNNERSCOUT_QUALIFY_AWS_AMI"
          require aws_instance_type "$RUNNERSCOUT_QUALIFY_AWS_INSTANCE_TYPE"
          require aws_architecture "$RUNNERSCOUT_QUALIFY_AWS_ARCHITECTURE"
          case "$RUNNERSCOUT_QUALIFY_AWS_AMI" in
            ami-*) ;;
            *) echo "::error::aws_ami_id ('$RUNNERSCOUT_QUALIFY_AWS_AMI') does not look like an ami-* id"; exit 1 ;;
          esac

      - name: "[Azure] Validate pinned compute inputs"
        if: matrix.provider == 'azure'
        # Cheap, local, no Azure call: enforces that every Azure-specific
        # input is actually present (see the AWS step's own comment on why
        # this is where "required for Azure" is enforced). Network
        # identifiers are no longer inputs here - only the compute shape
        # (image/VM size/zone) stays pinned.
        run: |
          set -euo pipefail
          # "unset" is azure_availability_zone's own sentinel default
          # (choice inputs cannot have an empty-string option) - treated the
          # same as genuinely empty.
          require() { [ -n "$2" ] && [ "$2" != "unset" ] || { echo "::error::$1 is required when provider is azure or all"; exit 1; }; }
          require azure_region "$RUNNERSCOUT_QUALIFY_AZURE_REGION"
          require azure_subscription_id "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID"
          require azure_image_id "$RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID"
          require azure_vm_size "$RUNNERSCOUT_QUALIFY_AZURE_VM_SIZE"
          require azure_availability_zone "$RUNNERSCOUT_QUALIFY_AZURE_ZONE"
          if ! [[ "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::azure_subscription_id ('$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID') does not look like a subscription GUID"
            exit 1
          fi
          lc() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          prefix="$(lc "/subscriptions/$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID/resourcegroups/")"
          case "$(lc "$RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID")" in
            "$prefix"*"/providers/microsoft.compute/images/"*) ;;
            *) echo "::error::azure_image_id ('$RUNNERSCOUT_QUALIFY_AZURE_IMAGE_ID') does not look like a Microsoft.Compute/images resource ID under subscription $RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID"; exit 1 ;;
          esac

      - name: "[GCP] Validate pinned compute inputs and project"
        if: matrix.provider == 'gcp'
        # Cheap, local, no GCP call: both the qualification and
        # network-provisioner WIF service accounts are only ever trusted to
        # act in one project each - requiring gcp_project as its own input
        # (rather than silently defaulting to a variable) keeps it an
        # explicit, pinned, operator-supplied value, while this check
        # catches a pasted-wrong-project mistake before any credential is
        # configured. Also enforces that every GCP-specific compute input
        # is actually present (see the AWS step's own comment on why this
        # is where "required for GCP" is enforced). Network identifiers are
        # no longer inputs here - only the compute shape stays pinned.
        env:
          RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT: ${{ vars.GCP_QUALIFICATION_PROJECT_ID }}
          RUNNERSCOUT_NETWORK_EXPECTED_PROJECT: ${{ vars.GCP_NETWORK_PROVISIONER_PROJECT_ID }}
        run: |
          set -euo pipefail
          require() { [ -n "$2" ] || { echo "::error::$1 is required when provider is gcp or all"; exit 1; }; }
          require gcp_project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT"
          require gcp_region "$RUNNERSCOUT_QUALIFY_GCP_REGION"
          require gcp_zone "$RUNNERSCOUT_QUALIFY_GCP_ZONE"
          require gcp_image "$RUNNERSCOUT_QUALIFY_GCP_IMAGE"
          require gcp_machine_type "$RUNNERSCOUT_QUALIFY_GCP_MACHINE_TYPE"
          if [ -z "$RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT" ]; then
            echo "::error::vars.GCP_QUALIFICATION_PROJECT_ID is not set - this repository has no GCP qualification identity provisioned yet; see docs/qualification-real-cloud.md's GCP section for what an operator must provision first"
            exit 1
          fi
          if [ "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" != "$RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT" ]; then
            echo "::error::gcp_project ('$RUNNERSCOUT_QUALIFY_GCP_PROJECT') does not match the provisioned qualification identity's project (vars.GCP_QUALIFICATION_PROJECT_ID) - refusing to proceed"
            exit 1
          fi
          if [ -z "$RUNNERSCOUT_NETWORK_EXPECTED_PROJECT" ]; then
            echo "::error::vars.GCP_NETWORK_PROVISIONER_PROJECT_ID is not set - this repository has no GCP network-provisioner identity provisioned yet; see docs/qualification-real-cloud.md's GCP section for what an operator must provision first"
            exit 1
          fi
          if [ "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" != "$RUNNERSCOUT_NETWORK_EXPECTED_PROJECT" ]; then
            echo "::error::gcp_project ('$RUNNERSCOUT_QUALIFY_GCP_PROJECT') does not match the provisioned network-provisioner identity's project (vars.GCP_NETWORK_PROVISIONER_PROJECT_ID) - refusing to proceed"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.11.4"
          tofu_wrapper: false

      # --- Network provisioning (network-provisioner identity) ----------

      - name: "[AWS] Confirm network-provisioner role is provisioned"
        if: matrix.provider == 'aws'
        env:
          RUNNERSCOUT_NETWORK_AWS_ROLE_ARN: ${{ secrets.AWS_NETWORK_PROVISIONER_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNERSCOUT_NETWORK_AWS_ROLE_ARN" ]; then
            echo "::error::AWS_NETWORK_PROVISIONER_ROLE_ARN repository secret is not set - this repository has no AWS network-provisioner identity provisioned yet; see docs/qualification-real-cloud.md's AWS section for what to provision before dispatching this workflow"
            exit 1
          fi
      - name: "[AWS] Authenticate network provisioner (OIDC role assumption)"
        if: matrix.provider == 'aws'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_NETWORK_PROVISIONER_ROLE_ARN }}
          role-session-name: runnerscout-network-provisioner-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
      - name: "[AWS] Provision qualification network (tofu apply)"
        if: matrix.provider == 'aws'
        working-directory: tools/tofu/qualify-network/aws
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu apply -auto-approve -input=false -var region="$RUNNERSCOUT_QUALIFY_AWS_REGION"
          {
            echo "RUNNERSCOUT_QUALIFY_VPC=$(tofu output -raw vpc_id)"
            echo "RUNNERSCOUT_QUALIFY_SUBNET=$(tofu output -raw subnet_id)"
            echo "RUNNERSCOUT_QUALIFY_SECURITY_GROUP=$(tofu output -raw security_group_id)"
            echo "RUNNERSCOUT_QUALIFY_ZONE=$(tofu output -raw availability_zone)"
          } >> "$GITHUB_ENV"

      - name: "[Azure] Confirm network-provisioner credentials are provisioned"
        if: matrix.provider == 'azure'
        env:
          RUNNERSCOUT_NETWORK_AZURE_CLIENT_ID: ${{ vars.AZURE_NETWORK_PROVISIONER_CLIENT_ID }}
          RUNNERSCOUT_NETWORK_AZURE_TENANT_ID: ${{ vars.AZURE_NETWORK_PROVISIONER_TENANT_ID }}
          RUNNERSCOUT_NETWORK_AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNERSCOUT_NETWORK_AZURE_CLIENT_ID" ] || [ -z "$RUNNERSCOUT_NETWORK_AZURE_TENANT_ID" ] || [ -z "$RUNNERSCOUT_NETWORK_AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::AZURE_NETWORK_PROVISIONER_CLIENT_ID, AZURE_NETWORK_PROVISIONER_TENANT_ID and AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID repository variables must all be set - see docs/qualification-real-cloud.md's Azure section for what to provision before dispatching this workflow"
            exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.provider == 'azure'
        with:
          client-id: ${{ vars.AZURE_NETWORK_PROVISIONER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_NETWORK_PROVISIONER_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
      - name: "[Azure] Export ARM_* environment for the azurerm OpenTofu provider"
        if: matrix.provider == 'azure'
        # The azurerm OpenTofu provider reads credentials from ARM_*
        # environment variables (distinct from the AZURE_CLIENT_ID/
        # AZURE_TENANT_ID/AZURE_FEDERATED_TOKEN_FILE the Go SDK's
        # WorkloadIdentityCredential reads later in this same job for the
        # qualification identity - no collision between the two). It
        # auto-detects GitHub Actions OIDC (via the ambient
        # ACTIONS_ID_TOKEN_REQUEST_* variables from the id-token: write
        # permission above) once ARM_USE_OIDC and the three IDs below are
        # present.
        run: |
          {
            echo "ARM_CLIENT_ID=${{ vars.AZURE_NETWORK_PROVISIONER_CLIENT_ID }}"
            echo "ARM_TENANT_ID=${{ vars.AZURE_NETWORK_PROVISIONER_TENANT_ID }}"
            echo "ARM_SUBSCRIPTION_ID=${{ vars.AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID }}"
            echo "ARM_USE_OIDC=true"
          } >> "$GITHUB_ENV"
      - name: "[Azure] Provision qualification network (tofu apply)"
        if: matrix.provider == 'azure'
        working-directory: tools/tofu/qualify-network/azure
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu apply -auto-approve -input=false -var location="$RUNNERSCOUT_QUALIFY_AZURE_REGION"
          {
            echo "RUNNERSCOUT_QUALIFY_RESOURCE_GROUP=$(tofu output -raw resource_group_name)"
            echo "RUNNERSCOUT_QUALIFY_SUBNET_ID=$(tofu output -raw subnet_id)"
            echo "RUNNERSCOUT_QUALIFY_NSG_ID=$(tofu output -raw nsg_id)"
          } >> "$GITHUB_ENV"

      - name: "[GCP] Confirm network-provisioner credentials are provisioned"
        if: matrix.provider == 'gcp'
        env:
          RUNNERSCOUT_NETWORK_GCP_SA: ${{ vars.GCP_NETWORK_PROVISIONER_SERVICE_ACCOUNT }}
          RUNNERSCOUT_NETWORK_GCP_WIP: ${{ vars.GCP_NETWORK_PROVISIONER_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNERSCOUT_NETWORK_GCP_SA" ] || [ -z "$RUNNERSCOUT_NETWORK_GCP_WIP" ]; then
            echo "::error::GCP_NETWORK_PROVISIONER_SERVICE_ACCOUNT and GCP_NETWORK_PROVISIONER_WORKLOAD_IDENTITY_PROVIDER repository variables must both be set - see docs/qualification-real-cloud.md's GCP section for what to provision before dispatching this workflow"
            exit 1
          fi
      - name: "[GCP] Authenticate network provisioner (Workload Identity Federation)"
        if: matrix.provider == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_NETWORK_PROVISIONER_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_NETWORK_PROVISIONER_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_NETWORK_PROVISIONER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: matrix.provider == 'gcp'
        with:
          version: ">= 480.0.0"
      - name: "[GCP] Provision qualification network (tofu apply)"
        if: matrix.provider == 'gcp'
        working-directory: tools/tofu/qualify-network/gcp
        run: |
          set -euo pipefail
          tofu init -input=false
          tofu apply -auto-approve -input=false -var project_id="$RUNNERSCOUT_QUALIFY_GCP_PROJECT" -var region="$RUNNERSCOUT_QUALIFY_GCP_REGION"
          {
            echo "RUNNERSCOUT_QUALIFY_NETWORK=$(tofu output -raw network_name)"
            echo "RUNNERSCOUT_QUALIFY_SUBNETWORK=$(tofu output -raw subnetwork_name)"
          } >> "$GITHUB_ENV"

      # --- Qualification identity: launch/observe/delete the real VM ----

      - name: "[AWS] Determine credential mode"
        if: matrix.provider == 'aws'
        id: aws_credmode
        # OIDC-preferred: if the operator has set the AWS_QUALIFICATION_ROLE_ARN
        # repository secret, assume that role via OIDC. Otherwise fall back
        # to the static-key secrets. Exactly one of the two
        # configure-aws-credentials steps below runs. This overwrites the
        # network-provisioner AWS session established above - both cannot
        # be active at once, and the network apply already completed.
        env:
          RUNNERSCOUT_QUALIFY_ROLE_ARN: ${{ secrets.AWS_QUALIFICATION_ROLE_ARN }}
        run: |
          if [ -n "$RUNNERSCOUT_QUALIFY_ROLE_ARN" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=static" >> "$GITHUB_OUTPUT"
          fi
      - name: "[AWS] Configure credentials (OIDC role assumption)"
        if: matrix.provider == 'aws' && steps.aws_credmode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_QUALIFICATION_ROLE_ARN }}
          role-session-name: runnerscout-qualify-aws-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
      - name: "[AWS] Configure credentials (static key fallback)"
        if: matrix.provider == 'aws' && steps.aws_credmode.outputs.mode == 'static'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_QUALIFICATION_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_QUALIFICATION_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}
      - name: "[AWS] Resolve account identity"
        if: matrix.provider == 'aws'
        # Read-only GetCallerIdentity call. No cross-validation of network
        # identifiers is needed here anymore - the network was just
        # created by the tofu apply step above, in this same job, so its
        # subnet/security-group/VPC relationship is structurally
        # guaranteed correct rather than something a pasted-in identifier
        # could get wrong.
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if ! [[ "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::unexpected AWS account id shape from STS: '$account_id'"
            exit 1
          fi
          # Unprefixed: exactly what internal/provider/aws_realcloud_test.go's
          # loadQualifyAWSEnv reads via os.Getenv.
          echo "RUNNERSCOUT_QUALIFY_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: "[Azure] Confirm qualification OIDC credentials are provisioned"
        if: matrix.provider == 'azure'
        env:
          RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID: ${{ vars.AZURE_QUALIFICATION_CLIENT_ID }}
          RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID: ${{ vars.AZURE_QUALIFICATION_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID" ] || [ -z "$RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID" ]; then
            echo "::error::AZURE_QUALIFICATION_CLIENT_ID and AZURE_QUALIFICATION_TENANT_ID repository variables must both be set - see docs/qualification-real-cloud.md's Azure section for what to provision (an Azure AD app registration with a federated credential trusting this repository's GitHub Actions OIDC issuer) before dispatching this workflow"
            exit 1
          fi
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: matrix.provider == 'azure'
        # Overwrites the network-provisioner `az` CLI session established
        # above - both cannot be active at once, and the network apply
        # already completed. ARM_* env vars from the network-provisioner
        # phase are left in place but unused from here on (the azurerm
        # OpenTofu provider isn't invoked again until teardown, which
        # re-authenticates as network-provisioner again first).
        with:
          client-id: ${{ vars.AZURE_QUALIFICATION_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_QUALIFICATION_TENANT_ID }}
          subscription-id: ${{ inputs.azure_subscription_id }}
          allow-no-subscriptions: false
      - name: "[Azure] Resolve subscription identity"
        if: matrix.provider == 'azure'
        # Read-only `az account show` call. No cross-validation of network
        # identifiers is needed here anymore - the network was just
        # created by the tofu apply step above, in this same job.
        run: |
          set -euo pipefail
          account_id="$(az account show --query id -o tsv)"
          if [ "$account_id" != "$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID" ]; then
            echo "::error::az login resolved subscription '$account_id', expected '$RUNNERSCOUT_QUALIFY_AZURE_SUBSCRIPTION_ID'"
            exit 1
          fi
      - name: "[Azure] Fetch GitHub OIDC token for the Go test's Workload Identity Federation"
        if: matrix.provider == 'azure'
        # Independent of azure/login above: that action only authenticates
        # the `az` CLI session used by this job's own steps, and does not
        # export any token or file a downstream Go SDK could reuse. This
        # step performs its own, separate GitHub OIDC token exchange, using
        # the exact "api://AzureADTokenExchange" audience an Azure AD app
        # registration's federated credential expects from GitHub Actions.
        # ACTIONS_ID_TOKEN_REQUEST_URL/ACTIONS_ID_TOKEN_REQUEST_TOKEN are
        # ambient runner-provided variables (from the id-token: write
        # permission above), not operator-supplied input.
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::no GitHub OIDC token endpoint available - id-token: write permission missing"
            exit 1
          fi
          token_file="${RUNNER_TEMP}/azure-federated-token.jwt"
          curl -sS -f -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
            | jq -r '.value' > "$token_file"
          if [ ! -s "$token_file" ] || grep -qx null "$token_file"; then
            echo "::error::failed to obtain a GitHub OIDC token for Azure Workload Identity Federation"
            exit 1
          fi
          {
            echo "AZURE_CLIENT_ID=$RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID"
            echo "AZURE_TENANT_ID=$RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID"
            echo "AZURE_FEDERATED_TOKEN_FILE=$token_file"
          } >> "$GITHUB_ENV"
        env:
          RUNNERSCOUT_QUALIFY_AZURE_CLIENT_ID: ${{ vars.AZURE_QUALIFICATION_CLIENT_ID }}
          RUNNERSCOUT_QUALIFY_AZURE_TENANT_ID: ${{ vars.AZURE_QUALIFICATION_TENANT_ID }}

      - name: "[GCP] Authenticate qualification identity (Workload Identity Federation)"
        if: matrix.provider == 'gcp'
        # Overwrites GOOGLE_APPLICATION_CREDENTIALS from the
        # network-provisioner phase above - both cannot be active at once,
        # and the network apply already completed.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_QUALIFICATION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_QUALIFICATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_QUALIFICATION_SERVICE_ACCOUNT }}
          # export_environment_variables defaults true: this exports
          # GOOGLE_APPLICATION_CREDENTIALS/CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
          # pointing at the same generated credential file - exactly the
          # environment shape internal/provider/gcp_credentials.go's
          # gcpCredential already reads from a nil environment map.

      - name: "[GCP] Cross-validate pinned zone/image against the project"
        if: matrix.provider == 'gcp'
        # Read-only `gcloud compute zones describe`/`images describe` calls.
        # No network-identifier cross-validation is needed here anymore -
        # the network was just created by the tofu apply step above, in
        # this same job. The zone-belongs-to-region check is unrelated to
        # that (gcp_zone/gcp_region are still real, independent operator
        # inputs, never derived from the network) and stays.
        run: |
          set -euo pipefail
          zone_region="$(gcloud compute zones describe "$RUNNERSCOUT_QUALIFY_GCP_ZONE" --project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" --format='value(region.basename())')"
          if [ "$zone_region" != "$RUNNERSCOUT_QUALIFY_GCP_REGION" ]; then
            echo "::error::gcp_zone '$RUNNERSCOUT_QUALIFY_GCP_ZONE' belongs to region '$zone_region', not the pinned gcp_region '$RUNNERSCOUT_QUALIFY_GCP_REGION' - refusing to proceed"
            exit 1
          fi
          if ! gcloud compute images describe "$RUNNERSCOUT_QUALIFY_GCP_IMAGE" --project "$RUNNERSCOUT_QUALIFY_GCP_PROJECT" >/dev/null 2>&1; then
            echo "::error::gcp_image '$RUNNERSCOUT_QUALIFY_GCP_IMAGE' could not be resolved in project '$RUNNERSCOUT_QUALIFY_GCP_PROJECT' - refusing to proceed"
            exit 1
          fi
          # Marker for the VM-level safety net below: this step only ever
          # runs once the qualification identity's own auth step succeeded
          # (implicit success() gating on its bare `if:`), unlike
          # GOOGLE_APPLICATION_CREDENTIALS, which stays set to the
          # NETWORK-PROVISIONER identity's credential file - never cleared
          # - when the network apply fails and every qualification step
          # after it is skipped. See the AWS safety-net step's own comment
          # for the real dispatch that found this exact class of bug.
          echo "RUNNERSCOUT_QUALIFY_GCP_AUTH_CONFIRMED=true" >> "$GITHUB_ENV"

      - name: "[AWS] Real-provider qualification (creates ONE real billed Spot instance)"
        if: matrix.provider == 'aws'
        # -tags realcloud selects internal/provider/aws_realcloud_test.go,
        # kept out of every other build/test path. -timeout is deliberately
        # larger than the create/observe/price budget above: that file's own
        # teardown runs on a separate, fixed 5-minute deadline that must not
        # be preempted by go test's own timeout while cleanup is still in
        # progress. RUNNERSCOUT_QUALIFY_VPC/SUBNET/SECURITY_GROUP/ZONE are
        # already set via GITHUB_ENV from the network apply step above.
        run: |
          # 10#... forces base-10 arithmetic regardless of leading zeros in
          # the input (bash's $(( )) otherwise treats a leading 0 as octal).
          go test -tags realcloud -run '^TestQualifyRealAWSSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/
        env:
          RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.aws_region }}
          RUNNERSCOUT_QUALIFY_AMI: ${{ inputs.aws_ami_id }}
          RUNNERSCOUT_QUALIFY_INSTANCE_TYPE: ${{ inputs.aws_instance_type }}
          RUNNERSCOUT_QUALIFY_ARCHITECTURE: ${{ inputs.aws_architecture }}

      - name: "[Azure] Real-provider qualification (creates ONE real billed Spot VM)"
        if: matrix.provider == 'azure'
        # -tags realcloud selects internal/provider/azure_realcloud_test.go.
        # RUNNERSCOUT_QUALIFY_RESOURCE_GROUP/SUBNET_ID/NSG_ID are already
        # set via GITHUB_ENV from the network apply step above.
        run: |
          go test -tags realcloud -run '^TestQualifyRealAzureSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/
        env:
          RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.azure_region }}
          RUNNERSCOUT_QUALIFY_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id }}
          RUNNERSCOUT_QUALIFY_IMAGE_ID: ${{ inputs.azure_image_id }}
          RUNNERSCOUT_QUALIFY_VM_SIZE: ${{ inputs.azure_vm_size }}
          RUNNERSCOUT_QUALIFY_ZONE: ${{ inputs.azure_availability_zone }}
          # "unset" (this optional input's own sentinel default, same
          # reason as azure_availability_zone's) becomes a genuinely empty
          # string here - loadQualifyAzureEnv reads this directly via
          # os.Getenv with no "unset" awareness of its own, since this
          # field is optional (never enforced by the require() checks
          # above, unlike every other Azure input). The condition is
          # deliberately written as `!= 'unset' && value || ''`, not
          # `== 'unset' && '' || value` - GitHub Actions expressions treat
          # an empty string as falsy, so the latter form's `cond && ''`
          # branch (true case) would itself be falsy and fall through to
          # the `|| value` fallback, silently reproducing the literal
          # string "unset" instead of "" on every default dispatch (caught
          # by adversarial review before merge - see
          # docs/qualification-real-cloud.background.md).
          RUNNERSCOUT_QUALIFY_AZURE_DISK_CONTROLLER_TYPE: ${{ inputs.azure_disk_controller_type != 'unset' && inputs.azure_disk_controller_type || '' }}

      - name: "[GCP] Real-provider qualification (creates ONE real billed Spot instance)"
        if: matrix.provider == 'gcp'
        # -tags realcloud selects internal/provider/gcp_realcloud_test.go,
        # living alongside, not replacing, aws_realcloud_test.go/
        # azure_realcloud_test.go. RUNNERSCOUT_QUALIFY_NETWORK/SUBNETWORK
        # are already set via GITHUB_ENV from the network apply step above.
        run: |
          go test -tags realcloud -run '^TestQualifyRealGCPSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/
        env:
          RUNNERSCOUT_QUALIFY_PROJECT: ${{ inputs.gcp_project }}
          RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.gcp_region }}
          RUNNERSCOUT_QUALIFY_ZONE: ${{ inputs.gcp_zone }}
          RUNNERSCOUT_QUALIFY_IMAGE: ${{ inputs.gcp_image }}
          RUNNERSCOUT_QUALIFY_MACHINE_TYPE: ${{ inputs.gcp_machine_type }}

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualify-${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          # RUNNERSCOUT_QUALIFY_EVIDENCE_DIR is a path relative to the Go
          # test BINARY's own working directory - which `go test` sets to
          # the package directory it's testing (./internal/provider/),
          # never the repo root this step's own `path:` resolves against
          # (GITHUB_WORKSPACE). Without the internal/provider/ prefix here,
          # this step silently found nothing to upload on every single
          # dispatch this repository has ever run, real successes
          # included - caught only by a human actually reading a run's log
          # ("No files were found...") rather than by any test or review,
          # since every run treated the resulting warning as cosmetic.
          path: internal/provider/${{ env.RUNNERSCOUT_QUALIFY_EVIDENCE_DIR }}/
          # warn, not error: a run that fails before the qualification test
          # ever starts (e.g. bad runtime ceiling, bad compute input)
          # legitimately produces no evidence directory at all - that is a
          # correct outcome, not a bug to surface loudly.
          if-no-files-found: warn
          retention-days: 14

      # --- Teardown: VM-level first, then the network it sat in ---------

      - name: "[AWS] Independent post-run cleanup safety net (VM-level)"
        if: always() && matrix.provider == 'aws'
        # THE authoritative teardown guarantee: runs via if: always(), so it
        # executes even if the step above was killed by the job timeout or
        # cancelled, in which case the Go test's own in-process t.Cleanup
        # teardown may never have run at all. This step re-derives
        # everything it needs from job env/inputs directly (never from a
        # prior step's output), so it works even when every earlier step
        # failed or was skipped - including the case where credentials were
        # never configured, handled by the guard below. Runs under whatever
        # AWS credentials are currently active (the qualification identity,
        # if its own steps ran) - VM-level resources must be gone before
        # the network-level teardown below can succeed.
        run: |
          set -euo pipefail
          # Deliberately NOT checking AWS_ACCESS_KEY_ID: that stays set to
          # the NETWORK-PROVISIONER identity's credentials (from the apply
          # step earlier in this job) even when the qualification identity
          # was never configured - e.g. when the network apply itself
          # failed and every qualification-credential step below it was
          # skipped. Checking it produced a real failure (discovered via an
          # actual dispatch): this step ran anyway, believed it had
          # qualification credentials, and got UnauthorizedOperation trying
          # to call ec2:DescribeInstances with the network-provisioner
          # role, which has no EC2-instance permissions by design.
          # RUNNERSCOUT_QUALIFY_ACCOUNT_ID is only ever set by "[AWS]
          # Resolve account identity" above, itself gated behind the
          # qualification credential steps having actually run - the right
          # signal for "did the qualification phase get this far".
          if [ -z "${RUNNERSCOUT_QUALIFY_ACCOUNT_ID:-}" ]; then
            echo "AWS qualification credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          region="$RUNNERSCOUT_QUALIFY_AWS_REGION"
          allocation="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          owner="runnerscout-qualify-aws"
          echo "Independent post-run inventory sweep for allocation $allocation in $region (owner tag $owner)"
          leftover=0

          # shellcheck disable=SC2016  # backticks below are JMESPath literal syntax, not shell command substitution - this whole --query argument is single-quoted precisely so the shell never touches it.
          instances="$(aws ec2 describe-instances --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'Reservations[].Instances[?State.Name!=`terminated`].InstanceId' --output text)"
          if [ -n "$instances" ]; then
            leftover=1
            echo "::warning::leftover AWS instance(s) not terminated by the qualification job: $instances - force-terminating now"
            # shellcheck disable=SC2086  # intentionally unquoted: --instance-ids takes one argument per id, and $instances is AWS CLI's own space-separated --output text list.
            aws ec2 terminate-instances --region "$region" --instance-ids $instances || true
            # Wait for actual termination before touching volumes/ENIs
            # below: both are created with DeleteOnTermination=true, so
            # deleting them explicitly while the instance is still
            # "shutting-down" races AWS's own automatic cleanup and fails
            # with VolumeInUse (found via an actual real-cloud dispatch -
            # see docs/qualification-real-cloud.background.md's "What real
            # dispatches found" section). Bounded by this waiter's own
            # default timeout; `|| true` since a slow/stuck termination
            # shouldn't block the volume/ENI sweep below from at least
            # trying.
            # shellcheck disable=SC2086  # see above: intentionally unquoted.
            aws ec2 wait instance-terminated --region "$region" --instance-ids $instances || true
          fi

          # shellcheck disable=SC2016  # see the describe-instances --query above: JMESPath literal, not shell expansion.
          volumes="$(aws ec2 describe-volumes --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'Volumes[?State!=`deleted`].VolumeId' --output text)"
          if [ -n "$volumes" ]; then
            leftover=1
            echo "::warning::leftover AWS volume(s): $volumes"
            for v in $volumes; do aws ec2 delete-volume --region "$region" --volume-id "$v" || true; done
          fi

          enis="$(aws ec2 describe-network-interfaces --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
          if [ -n "$enis" ]; then
            leftover=1
            echo "::warning::leftover AWS network interface(s): $enis"
            for e in $enis; do aws ec2 delete-network-interface --region "$region" --network-interface-id "$e" || true; done
          fi

          if [ "$leftover" -eq 1 ]; then
            echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
            exit 1
          fi
          echo "Independent inventory confirms zero leftover billable resources for allocation $allocation."

      - name: "[AWS] Destroy qualification network (tofu destroy)"
        if: always() && matrix.provider == 'aws'
        # Re-authenticates as the network-provisioner identity - the
        # qualification identity used just above has no permission to
        # delete VPC/subnet/NAT Gateway/security-group resources by design.
        # Runs via if: always() so the network is torn down even if an
        # earlier step failed - OpenTofu's local state (written
        # incrementally during apply, never left this job's filesystem)
        # still reflects whatever was actually created, so this correctly
        # tears down a partial apply too.
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_NETWORK_PROVISIONER_ROLE_ARN }}
          role-session-name: runnerscout-network-provisioner-destroy-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
      - name: "[AWS] tofu destroy"
        if: always() && matrix.provider == 'aws'
        working-directory: tools/tofu/qualify-network/aws
        run: |
          set -euo pipefail
          if [ ! -f terraform.tfstate ]; then
            echo "No OpenTofu state file present (apply never ran or never created anything) - nothing to destroy."
            exit 0
          fi
          tofu destroy -auto-approve -input=false -var region="$RUNNERSCOUT_QUALIFY_AWS_REGION"

      - name: "[Azure] Independent post-run cleanup safety net (VM-level)"
        if: always() && matrix.provider == 'azure'
        # Reuses the `az` CLI session the qualification azure/login step
        # already established earlier in this same job (that login
        # persists for the whole job, not just its own step) rather than
        # re-deriving Go SDK credentials.
        run: |
          set -euo pipefail
          if ! az account show >/dev/null 2>&1; then
            echo "Azure credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          alloc="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          rg="$RUNNERSCOUT_QUALIFY_RESOURCE_GROUP"
          if [ -z "$rg" ]; then
            echo "Qualification network was never provisioned this run (no resource group recorded) - nothing to independently verify or clean up."
            exit 0
          fi
          echo "Independent post-run inventory sweep for allocation $alloc in resource group $rg"
          # `az resource list` rejects combining --resource-group with
          # --tag (a real, hard CLI incompatibility, discovered via an
          # actual dispatch - see docs/qualification-real-cloud.background.md's
          # "What real dispatches found" section) - so the tag match is
          # done client-side via --query instead of the server-side --tag
          # filter.
          leftover_ids="$(az resource list --resource-group "$rg" --query "[?tags.\"runnerscout-operation\"=='$alloc'].id" -o tsv)"
          if [ -z "$leftover_ids" ]; then
            echo "Independent inventory confirms zero leftover billable resources for allocation $alloc."
            exit 0
          fi
          echo "::warning::leftover Azure resource(s) not deleted by the qualification job: $leftover_ids - force-cleaning now"
          # Delete VMs first: a NIC or disk still attached to a VM refuses
          # deletion until the VM itself is gone, mirroring deleteAzure's
          # own VM-then-NIC-then-disk priority order (azure.go).
          vm_ids="$(az resource list --resource-group "$rg" --resource-type Microsoft.Compute/virtualMachines --query "[?tags.\"runnerscout-operation\"=='$alloc'].id" -o tsv)"
          for id in $vm_ids; do az resource delete --ids "$id" --verbose || true; done
          remaining_ids="$(az resource list --resource-group "$rg" --query "[?tags.\"runnerscout-operation\"=='$alloc'].id" -o tsv)"
          for id in $remaining_ids; do az resource delete --ids "$id" --verbose || true; done
          echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
          exit 1

      - name: "[Azure] Re-authenticate network provisioner for teardown"
        if: always() && matrix.provider == 'azure'
        # Overwrites the qualification `az` CLI session and ARM_* env -
        # the qualification identity used just above has no permission to
        # delete resource-group/VNet/subnet/NSG resources by design. Runs
        # via if: always() so the network is torn down even if an earlier
        # step failed.
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_NETWORK_PROVISIONER_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_NETWORK_PROVISIONER_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false
      - name: "[Azure] Re-export ARM_* environment for teardown"
        if: always() && matrix.provider == 'azure'
        run: |
          {
            echo "ARM_CLIENT_ID=${{ vars.AZURE_NETWORK_PROVISIONER_CLIENT_ID }}"
            echo "ARM_TENANT_ID=${{ vars.AZURE_NETWORK_PROVISIONER_TENANT_ID }}"
            echo "ARM_SUBSCRIPTION_ID=${{ vars.AZURE_NETWORK_PROVISIONER_SUBSCRIPTION_ID }}"
            echo "ARM_USE_OIDC=true"
          } >> "$GITHUB_ENV"
      - name: "[Azure] Destroy qualification network (tofu destroy)"
        if: always() && matrix.provider == 'azure'
        # OpenTofu's local state (written incrementally during apply,
        # never left this job's filesystem) still reflects whatever was
        # actually created, so this correctly tears down a partial apply
        # too.
        working-directory: tools/tofu/qualify-network/azure
        run: |
          set -euo pipefail
          if [ ! -f terraform.tfstate ]; then
            echo "No OpenTofu state file present (apply never ran or never created anything) - nothing to destroy."
            exit 0
          fi
          tofu destroy -auto-approve -input=false -var location="$RUNNERSCOUT_QUALIFY_AZURE_REGION"

      - name: "[GCP] Independent post-run cleanup safety net (VM-level)"
        if: always() && matrix.provider == 'gcp'
        run: |
          set -euo pipefail
          # Deliberately NOT checking GOOGLE_APPLICATION_CREDENTIALS: that
          # stays set to the NETWORK-PROVISIONER identity's credential file
          # (from the apply step earlier in this job) even when the
          # qualification identity was never configured - e.g. when the
          # network apply itself failed and every qualification step below
          # it was skipped. RUNNERSCOUT_QUALIFY_GCP_AUTH_CONFIRMED is only
          # ever set by "[GCP] Cross-validate pinned zone/image against the
          # project" above, itself gated behind the qualification identity
          # having actually authenticated - the right signal for "did the
          # qualification phase get this far" (see the AWS safety-net
          # step's own comment for the real dispatch that found this exact
          # class of bug for AWS).
          if [ -z "${RUNNERSCOUT_QUALIFY_GCP_AUTH_CONFIRMED:-}" ]; then
            echo "GCP qualification credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          if ! command -v gcloud >/dev/null 2>&1; then
            echo "::warning::gcloud CLI unavailable this run (setup-gcloud step never ran) - cannot independently sweep for leftover GCP resources"
            exit 0
          fi
          project="$RUNNERSCOUT_QUALIFY_GCP_PROJECT"
          zone="$RUNNERSCOUT_QUALIFY_GCP_ZONE"
          region="$RUNNERSCOUT_QUALIFY_GCP_REGION"
          allocation="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          owner="runnerscout-qualify-gcp"
          filter="labels.runnerscout-owner=$owner AND labels.runnerscout-operation=$allocation"
          echo "Independent post-run inventory sweep for allocation $allocation in $project/$zone (owner label $owner)"
          leftover=0

          instances="$(gcloud compute instances list --project "$project" --zones "$zone" --filter "$filter" --format='value(name)')"
          if [ -n "$instances" ]; then
            leftover=1
            echo "::warning::leftover GCP instance(s) not deleted by the qualification job: $instances - force-deleting now"
            for i in $instances; do gcloud compute instances delete "$i" --project "$project" --zone "$zone" --quiet || true; done
          fi

          disks="$(gcloud compute disks list --project "$project" --zones "$zone" --filter "$filter" --format='value(name)')"
          if [ -n "$disks" ]; then
            leftover=1
            echo "::warning::leftover GCP disk(s): $disks"
            for d in $disks; do gcloud compute disks delete "$d" --project "$project" --zone "$zone" --quiet || true; done
          fi

          addresses="$(gcloud compute addresses list --project "$project" --regions "$region" --filter "$filter" --format='value(name)')"
          if [ -n "$addresses" ]; then
            leftover=1
            echo "::warning::leftover GCP reserved address(es): $addresses"
            for a in $addresses; do gcloud compute addresses delete "$a" --project "$project" --region "$region" --quiet || true; done
          fi

          if [ "$leftover" -eq 1 ]; then
            echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
            exit 1
          fi
          echo "Independent inventory confirms zero leftover billable resources for allocation $allocation."

      - name: "[GCP] Re-authenticate network provisioner for teardown"
        if: always() && matrix.provider == 'gcp'
        # Overwrites GOOGLE_APPLICATION_CREDENTIALS from the qualification
        # phase above - the qualification identity has no permission to
        # delete network/subnetwork/firewall resources by design. Runs via
        # if: always() so the network is torn down even if an earlier step
        # failed.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_NETWORK_PROVISIONER_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_NETWORK_PROVISIONER_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_NETWORK_PROVISIONER_SERVICE_ACCOUNT }}
      - name: "[GCP] Destroy qualification network (tofu destroy)"
        if: always() && matrix.provider == 'gcp'
        # OpenTofu's local state (written incrementally during apply, never
        # left this job's filesystem) still reflects whatever was actually
        # created, so this correctly tears down a partial apply too.
        working-directory: tools/tofu/qualify-network/gcp
        run: |
          set -euo pipefail
          if [ ! -f terraform.tfstate ]; then
            echo "No OpenTofu state file present (apply never ran or never created anything) - nothing to destroy."
            exit 0
          fi
          tofu destroy -auto-approve -input=false -var project_id="$RUNNERSCOUT_QUALIFY_GCP_PROJECT" -var region="$RUNNERSCOUT_QUALIFY_GCP_REGION"
