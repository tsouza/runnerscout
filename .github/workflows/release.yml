# Tag-triggered release pipeline (issue #17). This is the only place a
# release artifact build is triggered automatically: pushing a version tag
# matching docs/releases.md's vMAJOR.MINOR.PATCH convention. Once preflight
# passes, this workflow's `build` job invokes release-build.yml via
# workflow_call, which pushes the built image to ghcr.io/tsouza/runnerscout
# and signs it keylessly with cosign - see release-build.yml's own header
# for exactly why that publish half only ever runs from this path. It still
# never creates a GitHub Release - that remains a separate, manual decision
# per docs/releases.md.
name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve tagged commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run release preflight gate
        env:
          # Plain gh authenticated with the workflow's own GITHUB_TOKEN.
          # gh-tsouza is a local-machine-only wrapper for interactive human
          # sessions and does not exist on Actions runners.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_preflight.py \
            --candidate "${{ steps.resolve.outputs.sha }}" \
            --gh gh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-preflight-${{ steps.resolve.outputs.sha }}-${{ github.run_id }}
          path: evidence/release-preflight-*/manifest.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    needs: preflight
    uses: ./.github/workflows/release-build.yml
    # Reusable-workflow permissions can only be reduced, never elevated,
    # relative to what the caller grants here (see "Access permissions when
    # using workflow_call to run a reusable workflow" in GitHub's reusable
    # workflows docs). release-build.yml's publish job needs packages:write
    # (push to ghcr.io) and id-token:write (cosign keyless OIDC signing) in
    # addition to contents:read - granting them only here, not at this
    # workflow's top-level `permissions:`, keeps the blast radius limited to
    # this one job/call.
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      commit_sha: ${{ needs.preflight.outputs.sha }}
      release_tag: ${{ github.ref_name }}
