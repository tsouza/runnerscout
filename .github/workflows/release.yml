# Merge-to-main-triggered release pipeline. A chore(release) PR (opened by
# prepare-release.yml, staging a version bump into charts/runnerscout/
# Chart.yaml plus CHANGELOG.md) merging into main is what makes a release
# happen now - not a directly pushed tag. `gate` recognizes that merge
# (Chart.yaml's own appVersion has no matching git tag yet), `preflight`
# re-verifies it is safe to publish, and `goreleaser` creates the tag at
# that exact merge commit and runs `goreleaser release --clean`, which owns
# every build/sign/publish step .goreleaser.yml declares - see that file's
# own comments for what it does and why. release-build.yml (the old
# hand-rolled build/publish/release pipeline) is retired; goreleaser's own
# dockers_v2/docker_signs/checksum/release configuration replaces it
# entirely.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full tag history: release_gate.py checks for an existing v* tag
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet PyYAML==6.0.3
      - name: Check whether this commit's Chart.yaml appVersion is unreleased
        id: gate
        run: python3 tools/release_gate.py >> "$GITHUB_OUTPUT"

  preflight:
    name: preflight
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # This push-to-main trigger fires on the same event as ci.yml, which
      # races this job against ci.yml's own heavy post-merge jobs
      # (kubernetes-integration, cloud-emulators, chart, runtime-image can
      # each run several minutes) - confirmed in production: preflight ran
      # and failed seconds after a merge with every REQUIRED check still
      # queued. release_preflight.py's own single-snapshot design is
      # unchanged; this step is what makes "the moment preflight snapshots"
      # actually be after CI has settled, the way the old tag-push trigger
      # did implicitly by being paced by a human.
      - name: Wait for this commit's required checks to settle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/wait_for_checks.py \
            --candidate "${{ github.sha }}" \
            --gh gh
      # gh-tsouza is a local-machine-only wrapper; plain gh, authenticated
      # with this workflow's own GITHUB_TOKEN, is used in CI.
      - name: Run release preflight gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_preflight.py \
            --candidate "${{ github.sha }}" \
            --gh gh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-preflight-${{ github.sha }}-${{ github.run_id }}
          path: evidence/release-preflight-*/manifest.json
          if-no-files-found: error
          retention-days: 14

  goreleaser:
    name: goreleaser
    needs: [gate, preflight]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # contents: write to create+push the release tag and create the GitHub
    # Release; packages: write to push the image to ghcr.io; id-token:
    # write for cosign's keyless OIDC signing AND the provenance attestation
    # below (both use Sigstore's OIDC-backed keyless flow); attestations:
    # write for that attestation's own record. Narrowest grant, at the one
    # job that needs all four - matching this repo's existing permission-
    # scoping discipline (see the old release.yml/release-build.yml).
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser needs full tag history to compute .Version/changelog range
          persist-credentials: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install pinned Helm
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Idempotent: a tag that already exists at this exact commit (e.g. a
      # re-run after a transient goreleaser failure) is left alone; one
      # that exists anywhere else is a hard error rather than something
      # this job would ever move.
      - name: Create and push the release tag
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          existing="$(git rev-list -n 1 "$VERSION" 2>/dev/null || true)"
          head="$(git rev-parse HEAD)"
          if [ -n "$existing" ] && [ "$existing" != "$head" ]; then
            echo "tag $VERSION already exists at $existing, not $head - refusing to move it" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            git push origin "$VERSION"
          fi

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # SLSA build provenance for the Helm chart .tgz attached to the
      # GitHub Release (no binary archives - see .goreleaser.yml's own
      # comment). Lets a consumer verify the file they downloaded was built
      # in this repo at this exact commit via `gh attestation verify
      # runnerscout-X.Y.Z.tgz --owner tsouza`. The chart-oci job below signs
      # and attests the SAME chart's other distribution path (the OCI
      # artifact on ghcr.io) separately, since that is a different
      # artifact reference with its own digest, not something this step's
      # attestation covers.
      - name: Attest Helm chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-artifacts/chart/*.tgz

  chart-oci:
    name: chart-oci
    needs: [gate, preflight]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # packages: write to push the chart to ghcr.io; id-token: write for
    # cosign's keyless OIDC signing and the provenance attestation below
    # (both Sigstore OIDC-backed, same as the goreleaser job's own use of
    # both); attestations: write for that attestation's own record.
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Helm
        run: |
          curl --fail --silent --show-error --location https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz --output "$RUNNER_TEMP/helm.tar.gz"
          echo "1e4ab49e429626cf6c6958d914248b78c9730803c2751b87627e171dc800e7bb  $RUNNER_TEMP/helm.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      # helm push (Helm 3.8+) reads the same Docker-compatible credential
      # store docker/login-action above populated - no separate helm-only
      # login step, matching how the goreleaser job's own cosign step
      # already relies on that one login for both docker and cosign.
      - name: Package and push the chart as an OCI artifact
        id: push
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          bare="${VERSION#v}"
          helm package charts/runnerscout --destination "$RUNNER_TEMP" --version "$bare" --app-version "$bare"
          # helm push writes its "Pushed:"/"Digest:" progress lines to
          # stderr, not stdout - confirmed the hard way: a v1.2.6 run
          # pushed the chart successfully (visible in the raw job log) but
          # this step still failed, because `| tee push.log` only ever
          # captured the piped stdout stream, leaving push.log without
          # those lines, so the grep below silently matched nothing (exit
          # 1) and set -e killed the step before signing/attestation ever
          # ran. 2>&1 merges stderr into the same stream tee captures.
          helm push "$RUNNER_TEMP/runnerscout-$bare.tgz" oci://ghcr.io/tsouza/runnerscout/charts 2>&1 | tee "$RUNNER_TEMP/push.log"
          digest="$(grep -oP 'Digest: \Ksha256:\w+' "$RUNNER_TEMP/push.log")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "ref=ghcr.io/tsouza/runnerscout/charts/runnerscout:$bare" >> "$GITHUB_OUTPUT"

      - name: cosign sign the chart (keyless, by digest)
        run: cosign sign --yes "${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}"

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/tsouza/runnerscout/charts/runnerscout
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Idempotent - a re-run just replaces the same artifacthub.io tag.
      # Matches ../cerberus's own AH metadata push exactly; see
      # charts/runnerscout/artifacthub-repo.yml's own comment for what
      # this proves and why the repositoryID in it matters.
      - name: Push Artifact Hub repository metadata
        run: |
          oras push ghcr.io/tsouza/runnerscout/charts/runnerscout:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/runnerscout/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
