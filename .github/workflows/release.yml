# Tag-triggered release pipeline (issue #17). This is the only place a
# release artifact build is triggered automatically: pushing a version tag
# matching docs/releases.md's vMAJOR.MINOR.PATCH convention. It never
# publishes anything (no registry push, no signing, no GitHub Release) -
# see release-build.yml's own header and docs/releases.md for why that half
# stays a manual follow-up.
name: Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve tagged commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run release preflight gate
        env:
          # Plain gh authenticated with the workflow's own GITHUB_TOKEN.
          # gh-tsouza is a local-machine-only wrapper for interactive human
          # sessions and does not exist on Actions runners.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_preflight.py \
            --candidate "${{ steps.resolve.outputs.sha }}" \
            --gh gh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-preflight-${{ steps.resolve.outputs.sha }}-${{ github.run_id }}
          path: evidence/release-preflight-*/manifest.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: build
    needs: preflight
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      commit_sha: ${{ needs.preflight.outputs.sha }}
