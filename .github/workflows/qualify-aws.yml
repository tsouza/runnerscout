# Real-cloud AWS provider qualification (issue #3's remaining "Final real-cloud
# qualification" scope, AWS piece only - Azure/GCP are separate, later, not
# built here; see docs/qualification-real-cloud.md).
#
# This workflow provisions ONE real, billed EC2 Spot Instance through the
# production internal/provider AWS adapter (aws.go/aws_sdk.go/
# aws_inventory.go/internal/prices/aws.go - none of which this workflow or its
# accompanying test file modifies) and independently verifies it is fully torn
# down afterward. It is the single piece of automation in this repository that
# spends real money when it runs, so every design choice here is biased
# toward "impossible to trigger by accident" over convenience:
#
#   - workflow_dispatch is the ONLY trigger. No schedule, no push, no
#     pull_request. A human must explicitly run this, every time.
#   - A required `confirm_real_spend` input must match an exact literal
#     phrase, checked before anything else runs (including before AWS
#     credentials are ever configured) - a second, deliberate speed bump
#     beyond workflow_dispatch's own "someone had to click Run workflow"
#     protection, so a scripted `gh workflow run` with stale/default
#     arguments cannot silently provision real resources either.
#   - `max_runtime_minutes` is a required, explicit numeric VM-time bound -
#     issue #3's own "numeric spend/VM-time allocation" wording - validated
#     against a hard-coded workflow ceiling (RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES
#     below) that no input value can exceed. The job's own `timeout-minutes:`
#     is a second, independent, non-input-derived ceiling on the whole job.
#   - The AMI and every network identifier (VPC/subnet/security group) are
#     required operator-supplied inputs, per issue #3's "pinned
#     images/networks" wording - this workflow never discovers or selects
#     any of them dynamically. A pre-flight step independently cross-checks
#     that the given subnet and security group actually belong to the given
#     VPC before any AWS create call, catching a pasted-wrong-ID mistake
#     with zero cost (all of that is read-only DescribeX calls).
#   - Teardown/independent-verification runs via `if: always()` (see the
#     final job step), exactly like this repo's other CI jobs already do for
#     evidence upload - a failed or killed run must never leave a running,
#     billable VM behind. This is the authoritative backstop: it survives
#     even a job-level timeout or cancellation that would kill the Go test
#     process (and therefore skip its own in-process t.Cleanup) before it
#     could finish tearing down.
#
# Credentials: OIDC role assumption (aws-actions/configure-aws-credentials
# with role-to-assume) is strongly preferred, matching this repo's existing
# GHCR/cosign OIDC pattern in release-build.yml. A static-key fallback
# (AWS_QUALIFICATION_ACCESS_KEY_ID/AWS_QUALIFICATION_SECRET_ACCESS_KEY
# secrets) is also supported - both paths converge on the exact same
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/AWS_SESSION_TOKEN environment
# variables (configure-aws-credentials exports these identically regardless
# of which of its own input modes obtained them), which is exactly the
# credential shape internal/provider.NewCommand's "aws" branch already
# reads from a nil environment map - so no branching is needed anywhere
# below the credential-configuration step itself.
#
# No AWS secrets exist in this repository yet (confirmed empty at the time
# this workflow was written). Referencing them by name below is inert until
# an operator deliberately provisions and sets them - `gh secret list`/
# `gh variable list` staying empty means this workflow simply fails cleanly
# with a "secret/variable not found"-style error if ever dispatched today.
name: Qualify AWS (real cloud)
on:
  workflow_dispatch:
    inputs:
      confirm_real_spend:
        description: >-
          Must be exactly: I-UNDERSTAND-THIS-COSTS-REAL-MONEY - this run
          provisions one real, billed EC2 Spot Instance.
        required: true
        type: string
      aws_region:
        description: Pinned AWS region to qualify against (e.g. us-east-1).
        required: true
        type: string
      vpc_id:
        description: Pinned, pre-provisioned isolated VPC id (vpc-...) that subnet_id and security_group_id must both belong to.
        required: true
        type: string
      subnet_id:
        description: Pinned, pre-provisioned subnet id (subnet-...) to launch into.
        required: true
        type: string
      security_group_id:
        description: Pinned, pre-provisioned security group id (sg-...) to attach.
        required: true
        type: string
      ami_id:
        description: Pinned AMI id (ami-...) to launch. Must be available, EBS-backed, and match architecture below.
        required: true
        type: string
      instance_type:
        description: EC2 instance type (e.g. t3.micro / t4g.micro). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes.
        required: true
        type: string
      architecture:
        description: Must match ami_id's real architecture.
        required: true
        type: choice
        options:
          - amd64
          - arm64
      max_runtime_minutes:
        description: Hard VM-time bound for the create/observe/price phase, as a plain integer. Must be between 1 and 20 (workflow-enforced ceiling) - see this workflow's own header comment.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Only one real-cloud qualification run at a time, ever. A second dispatch
  # while one is in flight queues behind it rather than racing it for the
  # same pinned network resources - and cancel-in-progress is deliberately
  # false: cancelling a run that is mid-teardown of a real billed instance is
  # strictly worse than making the next run wait.
  group: qualify-aws
  cancel-in-progress: false
jobs:
  qualify:
    name: qualify
    runs-on: ubuntu-24.04
    # Hard-coded, independent of max_runtime_minutes: setup/build (~5m) +
    # the go test step's own worst-case -timeout below (max_runtime_minutes's
    # 20m ceiling + 10m, i.e. 30m, which already includes the test's own
    # fixed 5m teardown budget) + margin for the remaining steps. No input
    # can raise this.
    timeout-minutes: 40
    permissions:
      contents: read
      # Only consumed by the OIDC configure-aws-credentials step below, and
      # only when secrets.AWS_QUALIFICATION_ROLE_ARN is actually set - granting
      # it here is what makes that path possible at all, since a workflow's
      # committed permissions block cannot itself be made conditional on a
      # variable that may only be set later by an operator. The static-key
      # fallback path simply never uses this permission.
      id-token: write
    env:
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES: "20"
      RUNNERSCOUT_QUALIFY_CONFIRM: ${{ inputs.confirm_real_spend }}
      RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.aws_region }}
      RUNNERSCOUT_QUALIFY_VPC: ${{ inputs.vpc_id }}
      RUNNERSCOUT_QUALIFY_AMI: ${{ inputs.ami_id }}
      RUNNERSCOUT_QUALIFY_SUBNET: ${{ inputs.subnet_id }}
      RUNNERSCOUT_QUALIFY_SECURITY_GROUP: ${{ inputs.security_group_id }}
      RUNNERSCOUT_QUALIFY_INSTANCE_TYPE: ${{ inputs.instance_type }}
      RUNNERSCOUT_QUALIFY_ARCHITECTURE: ${{ inputs.architecture }}
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
      RUNNERSCOUT_QUALIFY_ALLOCATION_ID: qualify-${{ github.run_id }}
      RUNNERSCOUT_QUALIFY_EVIDENCE_DIR: evidence/qualify-aws-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate explicit confirmation and numeric runtime ceiling
        # Deliberately the very first step, before Go setup and before any
        # AWS credential is configured: an invalid confirmation phrase or an
        # out-of-bound runtime request must fail with zero AWS interaction
        # of any kind, not even a read-only one.
        run: |
          set -euo pipefail
          expected='I-UNDERSTAND-THIS-COSTS-REAL-MONEY'
          if [ "$RUNNERSCOUT_QUALIFY_CONFIRM" != "$expected" ]; then
            echo "::error::confirm_real_spend must be exactly '$expected' - refusing to provision real, billed AWS resources without this exact literal confirmation"
            exit 1
          fi
          max="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES"
          ceiling="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES"
          if ! [[ "$max" =~ ^[0-9]+$ ]] || [ "$max" -lt 1 ] || [ "$max" -gt "$ceiling" ]; then
            echo "::error::max_runtime_minutes must be a plain integer between 1 and $ceiling (hard-coded workflow ceiling); got '$max'"
            exit 1
          fi

      - name: Validate pinned identifier shapes
        # Cheap, local, no AWS call: catches an obviously-wrong paste (e.g. a
        # subnet id in the vpc_id field) before even resolving credentials.
        run: |
          set -euo pipefail
          check() {
            case "$2" in
              "$3"*) ;;
              *) echo "::error::$1 ('$2') does not look like a $3* id"; exit 1 ;;
            esac
          }
          check vpc_id "$RUNNERSCOUT_QUALIFY_VPC" vpc-
          check subnet_id "$RUNNERSCOUT_QUALIFY_SUBNET" subnet-
          check security_group_id "$RUNNERSCOUT_QUALIFY_SECURITY_GROUP" sg-
          check ami_id "$RUNNERSCOUT_QUALIFY_AMI" ami-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Determine AWS credential mode
        id: credmode
        # OIDC-preferred: if the operator has set the AWS_QUALIFICATION_ROLE_ARN
        # repository secret, assume that role via OIDC (id-token: write below).
        # Otherwise fall back to the static-key secrets. Exactly one of the two
        # configure-aws-credentials steps below runs. The role ARN is passed
        # through an env var rather than interpolated into the script text,
        # matching how every other operator/attacker-influenced value in this
        # workflow reaches a shell.
        #
        # Stored as a repository SECRET, not a variable, even though a role
        # ARN alone grants nothing without this repo's own OIDC trust policy
        # and a matching token - matching how it was actually provisioned
        # (`gh secret list` showing AWS_QUALIFICATION_ROLE_ARN; `gh variable
        # list` empty), so this reads `secrets.*` rather than `vars.*`.
        env:
          RUNNERSCOUT_QUALIFY_ROLE_ARN: ${{ secrets.AWS_QUALIFICATION_ROLE_ARN }}
        run: |
          if [ -n "$RUNNERSCOUT_QUALIFY_ROLE_ARN" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=static" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure AWS credentials (OIDC role assumption)
        if: steps.credmode.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_QUALIFICATION_ROLE_ARN }}
          role-session-name: runnerscout-qualify-aws-${{ github.run_id }}
          aws-region: ${{ inputs.aws_region }}
      - name: Configure AWS credentials (static key fallback)
        if: steps.credmode.outputs.mode == 'static'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_QUALIFICATION_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_QUALIFICATION_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region }}
        # Note: static keys are the fallback path - see
        # docs/qualification-real-cloud.md's "Credentials" section and
        # docs/qualification-real-cloud.background.md's "Why OIDC and the
        # static-key fallback were both built, not deferred" for why both
        # paths are supported rather than only one.

      - name: Resolve account identity and cross-validate pinned network identifiers
        # All read-only DescribeX/GetCallerIdentity calls - no resource is
        # created by this step. account_id feeds internal/provider.Config's
        # own AccountID cross-check (aws_sdk.go's session()) so a
        # misconfigured role/secret pointing at the wrong account is caught
        # here, not by an ambiguous later failure.
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          if ! [[ "$account_id" =~ ^[0-9]{12}$ ]]; then
            echo "::error::unexpected AWS account id shape from STS: '$account_id'"
            exit 1
          fi
          subnet_vpc="$(aws ec2 describe-subnets --region "$RUNNERSCOUT_QUALIFY_REGION" --subnet-ids "$RUNNERSCOUT_QUALIFY_SUBNET" --query 'Subnets[0].VpcId' --output text)"
          zone="$(aws ec2 describe-subnets --region "$RUNNERSCOUT_QUALIFY_REGION" --subnet-ids "$RUNNERSCOUT_QUALIFY_SUBNET" --query 'Subnets[0].AvailabilityZone' --output text)"
          sg_vpc="$(aws ec2 describe-security-groups --region "$RUNNERSCOUT_QUALIFY_REGION" --group-ids "$RUNNERSCOUT_QUALIFY_SECURITY_GROUP" --query 'SecurityGroups[0].VpcId' --output text)"
          if [ "$subnet_vpc" != "$RUNNERSCOUT_QUALIFY_VPC" ] || [ "$sg_vpc" != "$RUNNERSCOUT_QUALIFY_VPC" ]; then
            echo "::error::subnet $RUNNERSCOUT_QUALIFY_SUBNET (vpc $subnet_vpc) and/or security group $RUNNERSCOUT_QUALIFY_SECURITY_GROUP (vpc $sg_vpc) do not both belong to the pinned vpc_id $RUNNERSCOUT_QUALIFY_VPC - refusing to proceed"
            exit 1
          fi
          {
            echo "RUNNERSCOUT_QUALIFY_ACCOUNT_ID=$account_id"
            echo "RUNNERSCOUT_QUALIFY_ZONE=$zone"
          } >> "$GITHUB_ENV"

      - name: Real-AWS provider qualification (creates ONE real billed Spot instance)
        # -tags realcloud selects internal/provider/aws_realcloud_test.go,
        # kept out of every other build/test path (see that file's own
        # header). -timeout is deliberately larger than the create/observe/
        # price budget above: that file's own teardown runs on a separate,
        # fixed 5-minute deadline that must not be preempted by go test's
        # own timeout while cleanup is still in progress.
        run: |
          # 10#... forces base-10 arithmetic regardless of leading zeros in
          # the input (bash's $(( )) otherwise treats a leading 0 as octal).
          go test -tags realcloud -run '^TestQualifyRealAWSSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualify-aws-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNNERSCOUT_QUALIFY_EVIDENCE_DIR }}/
          # warn, not error: a run that fails before the qualification test
          # ever starts (e.g. bad confirm_real_spend, bad runtime ceiling)
          # legitimately produces no evidence directory at all - that is a
          # correct outcome for this workflow, not a bug to surface loudly.
          if-no-files-found: warn
          retention-days: 14

      - name: Independent post-run cleanup safety net
        # THE authoritative teardown guarantee: runs via if: always(), so it
        # executes even if the step above was killed by the job timeout or
        # cancelled, in which case the Go test's own in-process t.Cleanup
        # teardown (aws_realcloud_test.go) may never have run at all. This
        # step re-derives everything it needs from job env/inputs directly
        # (never from a prior step's output), so it works even when every
        # earlier step failed or was skipped - including the case where
        # credentials were never configured, handled by the guard below.
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "AWS credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          region="$RUNNERSCOUT_QUALIFY_REGION"
          allocation="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          owner="runnerscout-qualify-aws"
          echo "Independent post-run inventory sweep for allocation $allocation in $region (owner tag $owner)"
          leftover=0

          # shellcheck disable=SC2016  # backticks below are JMESPath literal syntax, not shell command substitution - this whole --query argument is single-quoted precisely so the shell never touches it.
          instances="$(aws ec2 describe-instances --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'Reservations[].Instances[?State.Name!=`terminated`].InstanceId' --output text)"
          if [ -n "$instances" ]; then
            leftover=1
            echo "::warning::leftover AWS instance(s) not terminated by the qualification job: $instances - force-terminating now"
            # shellcheck disable=SC2086  # intentionally unquoted: --instance-ids takes one argument per id, and $instances is AWS CLI's own space-separated --output text list.
            aws ec2 terminate-instances --region "$region" --instance-ids $instances
          fi

          # shellcheck disable=SC2016  # see the describe-instances --query above: JMESPath literal, not shell expansion.
          volumes="$(aws ec2 describe-volumes --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'Volumes[?State!=`deleted`].VolumeId' --output text)"
          if [ -n "$volumes" ]; then
            leftover=1
            echo "::warning::leftover AWS volume(s): $volumes"
            for v in $volumes; do aws ec2 delete-volume --region "$region" --volume-id "$v" || true; done
          fi

          enis="$(aws ec2 describe-network-interfaces --region "$region" \
            --filters "Name=tag:runnerscout-owner,Values=$owner" "Name=tag:runnerscout-operation,Values=$allocation" \
            --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)"
          if [ -n "$enis" ]; then
            leftover=1
            echo "::warning::leftover AWS network interface(s): $enis"
            for e in $enis; do aws ec2 delete-network-interface --region "$region" --network-interface-id "$e" || true; done
          fi

          if [ "$leftover" -eq 1 ]; then
            echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
            exit 1
          fi
          echo "Independent inventory confirms zero leftover billable resources for allocation $allocation."
