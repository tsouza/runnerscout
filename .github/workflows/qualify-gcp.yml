# Real-cloud GCP provider qualification (issue #3's remaining "Final
# real-cloud qualification" scope, GCP piece only - qualify-aws.yml is the
# separate AWS piece; Azure is separate and not built here either; see
# docs/qualification-real-cloud.md). This mirrors qualify-aws.yml's exact
# safety philosophy, adapted to GCP's real API shapes - it is the second
# piece of automation in this repository that spends real money when it
# runs, so it is biased the same way: "impossible to trigger by accident"
# over convenience.
#
#   - workflow_dispatch is the ONLY trigger. No schedule, no push, no
#     pull_request. A human must explicitly run this, every time.
#   - A required `confirm_real_spend` input must match an exact literal
#     phrase, checked before anything else runs (including before GCP
#     credentials are ever configured) - a second, deliberate speed bump
#     beyond workflow_dispatch's own "someone had to click Run workflow"
#     protection, so a scripted `gh workflow run` with stale/default
#     arguments cannot silently provision real resources either.
#   - `max_runtime_minutes` is a required, explicit numeric VM-time bound -
#     issue #3's own "numeric spend/VM-time allocation" wording - validated
#     against a hard-coded workflow ceiling (RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES
#     below) that no input value can exceed. The job's own `timeout-minutes:`
#     is a second, independent, non-input-derived ceiling on the whole job.
#   - The image and every network identifier (project/region/zone/network/
#     subnetwork) are required operator-supplied inputs, per issue #3's
#     "pinned images/networks" wording - this workflow never discovers or
#     selects any of them dynamically. A pre-flight step independently
#     cross-checks that the given subnetwork actually belongs to the given
#     network and region, and that the given zone actually belongs to the
#     given region, before any GCP create call, catching a pasted-wrong-ID
#     mistake with zero cost (all of that is read-only `gcloud ... describe`
#     calls).
#   - Teardown/independent-verification runs via `if: always()` (see the
#     final job step), exactly like this repo's other CI jobs already do for
#     evidence upload - a failed or killed run must never leave a running,
#     billable VM behind. This is the authoritative backstop: it survives
#     even a job-level timeout or cancellation that would kill the Go test
#     process (and therefore skip its own in-process t.Cleanup) before it
#     could finish tearing down.
#
# Credentials: Workload Identity Federation only
# (google-github-actions/auth with workload_identity_provider +
# service_account, id-token: write) - deliberately no service account key
# JSON fallback, unlike qualify-aws.yml's OIDC-preferred/static-key-fallback
# pair. See docs/qualification-real-cloud.background.md's GCP section for
# why: internal/provider.gcp_credentials.go's newGCPSDK reads
# GOOGLE_APPLICATION_CREDENTIALS/CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE as a
# credential FILE regardless of what kind of credential JSON it contains
# (service account key or external_account/WIF config) - so, unlike AWS,
# supporting a static-key fallback here would need no extra code either, but
# GCP service account keys are long-lived bearer secrets Google itself
# recommends against creating at all, and this repository's own GCP
# qualification identity (GCP_QUALIFICATION_WORKLOAD_IDENTITY_PROVIDER/
# GCP_QUALIFICATION_SERVICE_ACCOUNT/GCP_QUALIFICATION_PROJECT_ID repository
# variables - confirmed present via `gh variable list` at the time this
# workflow was written) was provisioned as WIF-only, with no matching key
# secret. Building an unused fallback path for a credential shape nothing
# provisions would be speculative, not "build it inert" - the inert-until-
# provisioned pattern qualify-aws.yml uses applies to authorization (the
# variables below), not to a second, unrequested credential mode.
name: Qualify GCP (real cloud)
on:
  workflow_dispatch:
    inputs:
      confirm_real_spend:
        description: >-
          Must be exactly: I-UNDERSTAND-THIS-COSTS-REAL-MONEY - this run
          provisions one real, billed Compute Engine Spot instance.
        required: true
        type: string
      gcp_project:
        description: Pinned GCP project id to qualify against. Must equal the vars.GCP_QUALIFICATION_PROJECT_ID this identity is provisioned for.
        required: true
        type: string
      gcp_region:
        description: Pinned GCP region to qualify against (e.g. us-central1).
        required: true
        type: string
      gcp_zone:
        description: Pinned GCP zone (e.g. us-central1-a). Must belong to gcp_region.
        required: true
        type: string
      gcp_network:
        description: Pinned, pre-provisioned isolated VPC network name that gcp_subnetwork must belong to.
        required: true
        type: string
      gcp_subnetwork:
        description: Pinned, pre-provisioned subnetwork name (in gcp_region) to launch into.
        required: true
        type: string
      gcp_image:
        description: >-
          Pinned boot image, as an exact image self-link (e.g.
          projects/debian-cloud/global/images/debian-12-bookworm-v20250910 -
          look up the current name with `gcloud compute images list
          --project debian-cloud --filter="family=debian-12"`). NEVER a
          rolling family reference (.../images/family/debian-12) - that
          resolves to whatever image is newest at create time, which is not
          a pinned identifier. Used verbatim as the instance's boot disk
          sourceImage, and resolved with `gcloud compute images describe`
          below, which only accepts an exact image name.
        required: true
        type: string
      machine_type:
        description: GCE machine type (e.g. e2-micro). Keep this cheap - it directly bounds real spend alongside max_runtime_minutes.
        required: true
        type: string
      max_runtime_minutes:
        description: Hard VM-time bound for the create/observe phase, as a plain integer. Must be between 1 and 20 (workflow-enforced ceiling) - see this workflow's own header comment.
        required: true
        type: string
permissions:
  contents: read
concurrency:
  # Only one real-cloud qualification run at a time, ever. A second dispatch
  # while one is in flight queues behind it rather than racing it for the
  # same pinned network resources - and cancel-in-progress is deliberately
  # false: cancelling a run that is mid-teardown of a real billed instance is
  # strictly worse than making the next run wait.
  group: qualify-gcp
  cancel-in-progress: false
jobs:
  qualify:
    name: qualify
    runs-on: ubuntu-24.04
    # Hard-coded, independent of max_runtime_minutes: setup/build (~5m) +
    # the go test step's own worst-case -timeout below (max_runtime_minutes's
    # 20m ceiling + 10m, i.e. 30m, which already includes the test's own
    # fixed 5m teardown budget) + margin for the remaining steps. No input
    # can raise this.
    timeout-minutes: 40
    permissions:
      contents: read
      # Only consumed by the google-github-actions/auth step below, for
      # Workload Identity Federation.
      id-token: write
    env:
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES: "20"
      RUNNERSCOUT_QUALIFY_CONFIRM: ${{ inputs.confirm_real_spend }}
      RUNNERSCOUT_QUALIFY_PROJECT: ${{ inputs.gcp_project }}
      RUNNERSCOUT_QUALIFY_REGION: ${{ inputs.gcp_region }}
      RUNNERSCOUT_QUALIFY_ZONE: ${{ inputs.gcp_zone }}
      RUNNERSCOUT_QUALIFY_NETWORK: ${{ inputs.gcp_network }}
      RUNNERSCOUT_QUALIFY_SUBNETWORK: ${{ inputs.gcp_subnetwork }}
      RUNNERSCOUT_QUALIFY_IMAGE: ${{ inputs.gcp_image }}
      RUNNERSCOUT_QUALIFY_MACHINE_TYPE: ${{ inputs.machine_type }}
      RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES: ${{ inputs.max_runtime_minutes }}
      RUNNERSCOUT_QUALIFY_ALLOCATION_ID: qualify-gcp-${{ github.run_id }}
      RUNNERSCOUT_QUALIFY_EVIDENCE_DIR: evidence/qualify-gcp-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate explicit confirmation and numeric runtime ceiling
        # Deliberately the very first step, before Go setup and before any
        # GCP credential is configured: an invalid confirmation phrase or an
        # out-of-bound runtime request must fail with zero GCP interaction
        # of any kind, not even a read-only one.
        run: |
          set -euo pipefail
          expected='I-UNDERSTAND-THIS-COSTS-REAL-MONEY'
          if [ "$RUNNERSCOUT_QUALIFY_CONFIRM" != "$expected" ]; then
            echo "::error::confirm_real_spend must be exactly '$expected' - refusing to provision real, billed GCP resources without this exact literal confirmation"
            exit 1
          fi
          max="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES"
          ceiling="$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_CEILING_MINUTES"
          if ! [[ "$max" =~ ^[0-9]+$ ]] || [ "$max" -lt 1 ] || [ "$max" -gt "$ceiling" ]; then
            echo "::error::max_runtime_minutes must be a plain integer between 1 and $ceiling (hard-coded workflow ceiling); got '$max'"
            exit 1
          fi

      - name: Validate pinned project against the provisioned qualification identity
        # Cheap, local, no GCP call: the WIF service account below is only
        # ever trusted to act in one project. Requiring gcp_project as its
        # own input (rather than silently defaulting to the variable) keeps
        # it an explicit, pinned, operator-supplied value per issue #3's
        # "pinned images/networks" wording, while this check catches a
        # pasted-wrong-project mistake before any credential is configured.
        env:
          RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT: ${{ vars.GCP_QUALIFICATION_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT" ]; then
            echo "::error::vars.GCP_QUALIFICATION_PROJECT_ID is not set - this repository has no GCP qualification identity provisioned yet; see docs/qualification-real-cloud.md's GCP section for what an operator must provision first"
            exit 1
          fi
          if [ "$RUNNERSCOUT_QUALIFY_PROJECT" != "$RUNNERSCOUT_QUALIFY_EXPECTED_PROJECT" ]; then
            echo "::error::gcp_project ('$RUNNERSCOUT_QUALIFY_PROJECT') does not match the provisioned qualification identity's project (vars.GCP_QUALIFICATION_PROJECT_ID) - refusing to proceed"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Reuse Go compiler output
        uses: ./.github/actions/go-build-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_QUALIFICATION_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_QUALIFICATION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_QUALIFICATION_SERVICE_ACCOUNT }}
          # export_environment_variables defaults true: this exports
          # GOOGLE_APPLICATION_CREDENTIALS/CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE
          # pointing at the same generated credential file - exactly the
          # environment shape internal/provider/gcp_credentials.go's
          # gcpCredential already reads from a nil environment map, so no
          # branching is needed anywhere below this step.

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: ">= 480.0.0"

      - name: Cross-validate pinned network identifiers and image
        # All read-only `gcloud ... describe` calls - no resource is created
        # by this step.
        run: |
          set -euo pipefail
          zone_region="$(gcloud compute zones describe "$RUNNERSCOUT_QUALIFY_ZONE" --project "$RUNNERSCOUT_QUALIFY_PROJECT" --format='value(region.basename())')"
          if [ "$zone_region" != "$RUNNERSCOUT_QUALIFY_REGION" ]; then
            echo "::error::gcp_zone '$RUNNERSCOUT_QUALIFY_ZONE' belongs to region '$zone_region', not the pinned gcp_region '$RUNNERSCOUT_QUALIFY_REGION' - refusing to proceed"
            exit 1
          fi
          subnet_network="$(gcloud compute networks subnets describe "$RUNNERSCOUT_QUALIFY_SUBNETWORK" --project "$RUNNERSCOUT_QUALIFY_PROJECT" --region "$RUNNERSCOUT_QUALIFY_REGION" --format='value(network.basename())')"
          if [ "$subnet_network" != "$RUNNERSCOUT_QUALIFY_NETWORK" ]; then
            echo "::error::gcp_subnetwork '$RUNNERSCOUT_QUALIFY_SUBNETWORK' (region $RUNNERSCOUT_QUALIFY_REGION) belongs to network '$subnet_network', not the pinned gcp_network '$RUNNERSCOUT_QUALIFY_NETWORK' - refusing to proceed"
            exit 1
          fi
          if ! gcloud compute images describe "$RUNNERSCOUT_QUALIFY_IMAGE" --project "$RUNNERSCOUT_QUALIFY_PROJECT" >/dev/null 2>&1; then
            echo "::error::gcp_image '$RUNNERSCOUT_QUALIFY_IMAGE' could not be resolved in project '$RUNNERSCOUT_QUALIFY_PROJECT' - refusing to proceed"
            exit 1
          fi

      - name: Real-GCP provider qualification (creates ONE real billed Spot instance)
        # -tags realcloud selects internal/provider/gcp_realcloud_test.go,
        # kept out of every other build/test path (see that file's own
        # header) and living alongside, not replacing,
        # aws_realcloud_test.go. -timeout is deliberately larger than the
        # create/observe budget above: that file's own teardown runs on a
        # separate, fixed 5-minute deadline that must not be preempted by go
        # test's own timeout while cleanup is still in progress.
        run: |
          # 10#... forces base-10 arithmetic regardless of leading zeros in
          # the input (bash's $(( )) otherwise treats a leading 0 as octal).
          go test -tags realcloud -run '^TestQualifyRealGCPSpotLifecycle$' -v -count=1 \
            -timeout "$((10#$RUNNERSCOUT_QUALIFY_MAX_RUNTIME_MINUTES + 10))m" \
            ./internal/provider/

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualify-gcp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNNERSCOUT_QUALIFY_EVIDENCE_DIR }}/
          # warn, not error: a run that fails before the qualification test
          # ever starts (e.g. bad confirm_real_spend, bad runtime ceiling)
          # legitimately produces no evidence directory at all - that is a
          # correct outcome for this workflow, not a bug to surface loudly.
          if-no-files-found: warn
          retention-days: 14

      - name: Independent post-run cleanup safety net
        # THE authoritative teardown guarantee: runs via if: always(), so it
        # executes even if the step above was killed by the job timeout or
        # cancelled, in which case the Go test's own in-process t.Cleanup
        # teardown (gcp_realcloud_test.go) may never have run at all. This
        # step re-derives everything it needs from job env/inputs directly
        # (never from a prior step's output), so it works even when every
        # earlier step failed or was skipped - including the case where
        # credentials were never configured, handled by the guard below.
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "GCP credentials were never configured this run - nothing to independently verify or clean up."
            exit 0
          fi
          if ! command -v gcloud >/dev/null 2>&1; then
            echo "::warning::gcloud CLI unavailable this run (setup-gcloud step never ran) - cannot independently sweep for leftover GCP resources"
            exit 0
          fi
          project="$RUNNERSCOUT_QUALIFY_PROJECT"
          zone="$RUNNERSCOUT_QUALIFY_ZONE"
          region="$RUNNERSCOUT_QUALIFY_REGION"
          allocation="$RUNNERSCOUT_QUALIFY_ALLOCATION_ID"
          owner="runnerscout-qualify-gcp"
          filter="labels.runnerscout-owner=$owner AND labels.runnerscout-operation=$allocation"
          echo "Independent post-run inventory sweep for allocation $allocation in $project/$zone (owner label $owner)"
          leftover=0

          instances="$(gcloud compute instances list --project "$project" --zones "$zone" --filter "$filter" --format='value(name)')"
          if [ -n "$instances" ]; then
            leftover=1
            echo "::warning::leftover GCP instance(s) not deleted by the qualification job: $instances - force-deleting now"
            for i in $instances; do gcloud compute instances delete "$i" --project "$project" --zone "$zone" --quiet || true; done
          fi

          disks="$(gcloud compute disks list --project "$project" --zones "$zone" --filter "$filter" --format='value(name)')"
          if [ -n "$disks" ]; then
            leftover=1
            echo "::warning::leftover GCP disk(s): $disks"
            for d in $disks; do gcloud compute disks delete "$d" --project "$project" --zone "$zone" --quiet || true; done
          fi

          addresses="$(gcloud compute addresses list --project "$project" --regions "$region" --filter "$filter" --format='value(name)')"
          if [ -n "$addresses" ]; then
            leftover=1
            echo "::warning::leftover GCP reserved address(es): $addresses"
            for a in $addresses; do gcloud compute addresses delete "$a" --project "$project" --region "$region" --quiet || true; done
          fi

          if [ "$leftover" -eq 1 ]; then
            echo "::error::the qualification job's own cleanup left billable resources behind; this safety net has force-cleaned them, but this indicates a real bug in the create/observe/delete path above and must not be treated as a normal outcome"
            exit 1
          fi
          echo "Independent inventory confirms zero leftover billable resources for allocation $allocation."
