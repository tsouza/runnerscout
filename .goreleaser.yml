version: 2

# archives: below is formats: [none] - deliberately. runnerscout is only
# ever deployed as a container via Helm; nobody consumes a standalone
# binary today, so a goreleaser-produced tar.gz would be a new artifact
# surface with no consumer. The binary below exists only to feed the
# Dockerfile's COPY - see dockers_v2 - never published on its own.
#
# goreleaser creates a DEFAULT tar.gz archive per build automatically once
# builds: is real (unlike the earlier skip:true stub, which produced none)
# - there is no implicit opt-out. Confirmed the hard way: v1.2.4 published
# runnerscout_1.2.4_linux_amd64.tar.gz and _arm64.tar.gz as real release
# assets, exactly the standalone-binary surface already decided against
# when this pipeline was designed - an explicit archives: block was simply
# missing.
#
# goreleaser builds the binary itself (rather than the Dockerfile running
# `go build` in its own stage, as the old pipeline's Dockerfile did): a
# Dockerfile that compiles from source makes goreleaser's own dockers_v2
# unable to tell what it's shipping, which it flags on every release
# ("no binaries or packages found for the given platform - COPY/ADD may
# not work", "extra_files may contain unnecessary build files" for go.mod/
# cmd//internal//api/ - confirmed on the v1.2.3 release run). This is
# goreleaser's own canonical pattern instead: it cross-compiles, the
# Dockerfile only COPYs the result in. `make image` and ci.yml's
# runtime-image job run `goreleaser build --single-target --snapshot` for
# the same reason before their own plain `docker build`, so every path
# that produces this image goes through the same compile step.
builds:
  - id: runnerscout
    main: ./cmd/runnerscout
    binary: runnerscout
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    # v-prefixed to match internal/version.Version's own documented format
    # and every tagged release before this pipeline (see dockers_v2.tags'
    # own comment on the same point for image tags).
    ldflags:
      - -s -w -X github.com/tsouza/runnerscout/internal/version.Version=v{{.Version}}

# formats: [none] skips archive creation/upload entirely - not "binary"
# (which still uploads the raw binary directly as a release asset, still a
# new consumer-facing surface) and not omitting archives: (which defaults
# to tar.gz, see builds:' own comment above for what that actually did).
archives:
  - formats: [none]

before:
  hooks:
    - go mod tidy
    - helm lint charts/runnerscout --strict --kube-version 1.37.0 -f charts/runnerscout/tests/values.json
    # dist/ is goreleaser-owned - it errors if anything is there before it
    # creates that directory itself, so the chart package is staged outside
    # it, in release-artifacts/ (matching the old pipeline's own directory
    # name for continuity).
    - sh -c 'mkdir -p release-artifacts/chart && helm package charts/runnerscout --destination release-artifacts/chart --version {{trimprefix .Version "v"}} --app-version {{trimprefix .Version "v"}}'

dockers_v2:
  - id: runnerscout-image
    dockerfile: Dockerfile
    # No extra_files: the builds: binary above is what the Dockerfile
    # COPYs in now - dockers_v2 stages it into the per-platform build
    # context automatically at $TARGETPLATFORM/runnerscout, matching the
    # Dockerfile's own COPY instruction exactly.
    images:
      - ghcr.io/tsouza/runnerscout
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{.Version}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
    # v-prefixed: every release before this pipeline (and the Helm chart's
    # own documented values.yaml example, `ghcr.io/tsouza/runnerscout:v1.0.0`)
    # used a v-prefixed image tag. `.Version` itself is bare ("1.2.3", not
    # "v1.2.3") - a bare `{{.Version}}` here silently broke that convention
    # on the v1.2.3 release: the image published as :1.2.3, not :v1.2.3,
    # which is not the same reference and is not automatically resolved by
    # a puller that (correctly, by every prior release's own convention)
    # asks for the v-prefixed tag - confirmed via a real ImagePullBackOff
    # this caused, not a hypothetical.
    tags:
      - "v{{.Version}}"
      - "{{.FullCommit}}"
    # buildx-native SBOM attestation on the image index - no separate syft
    # step needed, replacing anchore/sbom-action from the old pipeline.
    sbom: true

# Keyless: cosign uses this job's own GitHub Actions OIDC identity to obtain
# a short-lived certificate from Sigstore's public Fulcio CA, and publishes
# to Sigstore's public Rekor transparency log - no stored private key,
# matching the old pipeline's own signing approach exactly.
#
# ${artifact}@${digest}, not bare ${artifact}: a plain tag reference (the
# v1.2.3 run signed ghcr.io/tsouza/runnerscout:1.2.3 and :<commit-sha> this
# way) means the tag could move between goreleaser's own push and this sign
# step, so cosign would sign whatever the tag happens to resolve to at sign
# time, not provably the image just pushed - cosign's own CLI warns exactly
# this ("uses a tag, not a digest ... will be removed in a future release").
# ${artifact}@${digest} is goreleaser's own documented default args value
# when args is left unset; this repo only overrides it for --yes.
docker_signs:
  - artifacts: images
    cmd: cosign
    args: ["sign", "--yes", "${artifact}@${digest}"]
    output: true

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: release-artifacts/chart/*.tgz

snapshot:
  # No "+" - a real vX.Y.Z tag's .Version never contains one, but this
  # template is also used verbatim as a Docker image tag in dockers_v2
  # below, and Docker tags don't allow "+" (found by actually running
  # `goreleaser release --snapshot --clean` locally, not assumed).
  version_template: "{{ incpatch .Version }}-snapshot-{{.ShortCommit}}"

# goreleaser does not generate its own changelog file here - CHANGELOG.md is
# maintained by tools/prepare_release.py as part of the release PR.
# GitHub's own native release-notes generation covers the GitHub Release
# body itself.
changelog:
  use: github-native

release:
  github:
    owner: tsouza
    name: runnerscout
  # Pre-1.0 APIs remain experimental (docs/releases.md) - matches the old
  # pipeline's own major-version-only prerelease rule.
  prerelease: auto
  extra_files:
    - glob: release-artifacts/chart/*.tgz
  header: |
    See CHANGELOG.md for the full categorized changelog.
