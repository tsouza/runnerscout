{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runnerscout.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "runnerscout.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
