{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runnerscout.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "runnerscout.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runnerscout.fullname" . }}-checks
spec:
  podSelector:
    matchLabels:
      {{- include "runnerscout.podPolicySelector" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [configuration-check, cleanup-check]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
