{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "runnerscout.sa" . }}
  labels:
    {{- include "runnerscout.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "runnerscout.fullname" . }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
  {{- if .Values.crd.scaleSetName }}
  - apiGroups: [runnerscout.io]
    resources: [runnerscalesets, runnerscalesets/status]
    resourceNames: [{{ .Values.crd.scaleSetName | quote }}]
    verbs: [get, update]
  - apiGroups: [runnerscout.io]
    resources: [providerconfigs, runnerclasses, capacitycatalogs, networkprofiles, capacitybudgets]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- toYaml .Values.crd.secretNames | nindent 6 }}
    verbs: [get]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "runnerscout.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "runnerscout.sa" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "runnerscout.fullname" . }}
{{- end }}
