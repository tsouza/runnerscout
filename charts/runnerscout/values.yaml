# Explicit image coordinates are always required - this chart never assumes
# a default registry or tag, and values.schema.json enforces a non-empty
# repository. Set these to a published image, e.g.
# ghcr.io/tsouza/runnerscout:v1.0.0.
image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
  annotations: {}
rbac:
  create: true
# Empty scaleSetName selects mounted JSON mode. CRD mode reads only the named
# same-namespace Secrets listed here; include GitHub and provider references.
crd:
  scaleSetName: ""
  secretNames: []
github:
  existingSecret: ""
  mode: app
  tokenKey: token
  privateKeyKey: privateKey
  appClientID: ""
  appInstallationID: 0
# Native controller JSON, excluding namespace (derived from the Helm release).
# Credentials belong in existing Secrets, never this ConfigMap.
config: {}
# Optional existing ConfigMap with catalog.json; controller reloads new admissions.
catalog:
  existingConfigMap: ""
# Mount provider credential files from pre-existing Secrets. Workload identity can
# instead use serviceAccount.annotations and env. No credentials are created.
credentialSecrets: []
env: []
# Kubernetes client-side rate limit for the controller's in-cluster API
# client. Empty (default, either field independently) leaves the binary's
# own default in effect for that flag - QPS 20 requests/second, Burst 40,
# both already well above client-go's library defaults of 5/10 (see
# docs/operations.md). Set either to override, e.g. to raise the ceiling
# further under real PR-storm load, or to lower it under a stricter API
# server rate-limit policy.
kubeClient:
  qps: ""
  burst: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
networkPolicy:
  enabled: false
  egress: []
tests:
  enabled: true
  retainPod: false
