# Artifact Hub repository metadata for the runnerscout OCI chart.
#
# Pushed once (idempotently) as the special AH artifact alongside the chart:
#
#   oras push ghcr.io/tsouza/runnerscout/charts/runnerscout:artifacthub.io \
#     --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
#     artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
#
# repositoryID is the UUID Artifact Hub issued when the OCI repo
# (oci://ghcr.io/tsouza/runnerscout/charts/runnerscout) was registered under
# the tsouza account, confirming AH can verify ownership of the published
# chart. Matches ../cerberus's own artifacthub-repo.yml for the same owner.
repositoryID: "6bb31e06-2dfc-4e8c-9400-fbc85723dec8"
owners:
  - name: tsouza
    email: tcostasouza@gmail.com
